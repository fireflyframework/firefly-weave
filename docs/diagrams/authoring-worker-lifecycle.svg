<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1918" viewBox="0 0 960 1918" role="img" aria-labelledby="title desc">
<title id="title">Give a worker permission for one attempt</title><desc id="desc">Read down. 1. Admit the build and register the process: the deployer admits an immutable image digest with exact taskType@taskVersion capabilities, schemas, and effect policy; the authenticated worker registers its release, task types, and capacity; current grants are required. 2. Prepare the workflow task: activation selects the release binding, and the task has validated input and a stable operation_key that is kept across recovery. 3. Claim a compatible task: a claim returns no work or one or more leases; each lease proof identifies the task, generation, owner instance, and a secret token. 4. Run the handler and renew authority: send operation_key to the external target for deduplication; heartbeat only while authorized, never past the absolute task deadline. 5. Deliver a completion or failure with the lease proof and a completion ID, and read the committed acknowledgment. 6. Only when an attempt ends without step 5, recovery can issue a new generation and lease proof; a dashed arrow returns to step 3 because the task is claimed again. The old attempt cannot complete the new one, the operation_key stays stable, and the target must durably deduplicate. Plan for at-least-once delivery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.edge{stroke:#367D68;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="1818" rx="24" fill="#FAFCFB"/>
<rect x="32" y="30" width="7" height="58" rx="3" fill="#367D68"/>
<text x="58" y="58" font-size="32" font-weight="700" fill="#173D34">Give a worker permission for one attempt</text>
<text x="58" y="102" font-size="21" font-weight="400" fill="#173D34">A release identifies an allowed build. A lease authorizes one running</text>
<text x="58" y="131" font-size="21" font-weight="400" fill="#173D34">instance to attempt one task.</text>
<rect x="40" y="154" width="880" height="44" rx="12" fill="#EEF4F0"/>
<text x="58" y="182" font-size="19" font-weight="600" fill="#173D34">READ DOWN  •  Solid arrows: normal path  •  Dashed: recovery after a lost lease</text>
<rect x="40" y="232" width="840" height="216" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="249" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 264) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m6 16 22-11 22 11v25L28 52 6 41z M6 16l22 12 22-12 M28 28v24 M17 11l22 11"/></g>
<text x="168" y="275" font-size="25" font-weight="700" fill="#173D34">1. Admit the build and register the process</text>
<text x="168" y="314" font-size="22" font-weight="400" fill="#173D34">The deployer admits an immutable image digest and exact</text>
<text x="168" y="343" font-size="22" font-weight="400" fill="#173D34">taskType@taskVersion, schemas, and effect policy.</text>
<text x="168" y="372" font-size="22" font-weight="400" fill="#173D34">The authenticated worker registers its release, task types,</text>
<text x="168" y="401" font-size="22" font-weight="400" fill="#173D34">and capacity.</text>
<text x="168" y="430" font-size="18" font-weight="600" fill="#326B88">PREPARE • Current grants are required</text>
<path class="edge" d="M460 452v35"/>
<rect x="40" y="500" width="840" height="158" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="517" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 532) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h20l11 11v35H12z M32 5v12h11 M20 27h15 M20 35h15 M20 43h10"/></g>
<text x="168" y="543" font-size="25" font-weight="700" fill="#173D34">2. Prepare the workflow task</text>
<text x="168" y="582" font-size="22" font-weight="400" fill="#173D34">Activation selects the release binding.</text>
<text x="168" y="611" font-size="22" font-weight="400" fill="#173D34">The task has validated input and a stable operation_key.</text>
<text x="168" y="640" font-size="18" font-weight="600" fill="#326B88">IDENTITY • Keep the operation key across recovery</text>
<path class="edge" d="M460 662v35"/>
<rect x="40" y="710" width="840" height="187" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="727" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 742) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="19" r="12"/><path d="m27 28 22 22 M36 37l7-7 M43 44l7-7"/></g>
<text x="168" y="753" font-size="25" font-weight="700" fill="#173D34">3. Claim a compatible task</text>
<text x="168" y="792" font-size="22" font-weight="400" fill="#173D34">The claim may return no work or one or more leases.</text>
<text x="168" y="821" font-size="22" font-weight="400" fill="#173D34">A proof identifies task, generation, owner instance, and a</text>
<text x="168" y="850" font-size="22" font-weight="400" fill="#173D34">secret token. Keep that proof private.</text>
<text x="168" y="879" font-size="18" font-weight="600" fill="#326B88">LEASE • Temporary authority for this attempt</text>
<path class="edge" d="M460 901v35"/>
<rect x="40" y="949" width="840" height="187" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="966" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 981) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="23"/><path d="M28 13v16l11 7 M28 5v4 M5 28h4 M47 28h4"/></g>
<text x="168" y="992" font-size="25" font-weight="700" fill="#173D34">4. Run the handler and renew authority</text>
<text x="168" y="1031" font-size="22" font-weight="400" fill="#173D34">Send operation_key to the external target for deduplication.</text>
<text x="168" y="1060" font-size="22" font-weight="400" fill="#173D34">Heartbeat only while authorized; renewal cannot exceed the</text>
<text x="168" y="1089" font-size="22" font-weight="400" fill="#173D34">absolute task deadline.</text>
<text x="168" y="1118" font-size="18" font-weight="600" fill="#326B88">EXECUTE • External effects are separate from completion</text>
<path class="edge" d="M460 1140v35"/>
<rect x="40" y="1188" width="840" height="158" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="1205" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 1220) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="23"/><path d="m14 28 10 10 19-22"/></g>
<text x="168" y="1231" font-size="25" font-weight="700" fill="#173D34">5. Deliver a completion or failure</text>
<text x="168" y="1270" font-size="22" font-weight="400" fill="#173D34">Send the lease proof and completion ID.</text>
<text x="168" y="1299" font-size="22" font-weight="400" fill="#173D34">Read the committed acknowledgment that the API returns.</text>
<text x="168" y="1328" font-size="18" font-weight="600" fill="#326B88">RECEIPT • Evidence that the outcome was accepted</text>
<rect x="40" y="1398" width="840" height="187" rx="18" fill="white" stroke="#7FA99A" stroke-width="2" stroke-dasharray="10 6"/>
<rect x="56" y="1415" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 1430) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19A22 22 0 1 1 7 37 M8 6v14h14"/></g>
<text x="168" y="1441" font-size="25" font-weight="700" fill="#173D34">6. Recover with a new fenced attempt</text>
<text x="168" y="1480" font-size="22" font-weight="400" fill="#173D34">Recovery changes the generation and lease proof.</text>
<text x="168" y="1509" font-size="22" font-weight="400" fill="#173D34">The old attempt cannot complete the new one. The operation_key</text>
<text x="168" y="1538" font-size="22" font-weight="400" fill="#173D34">stays stable; the target must durably deduplicate.</text>
<text x="168" y="1567" font-size="18" font-weight="600" fill="#326B88">RECOVERY • Heartbeats and fencing do not undo effects</text>
<text x="48" y="1381" font-size="18" font-weight="700" fill="#367D68">IF AN ATTEMPT ENDS WITHOUT STEP 5 (a crash or an expired lease)</text>
<path d="M880 1491H898V803H884" fill="none" stroke="#367D68" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="922" y="1147" transform="rotate(-90 922 1147)" text-anchor="middle" font-size="17" font-weight="700" fill="#367D68">A new generation is claimed again</text>
<rect x="40" y="1609" width="880" height="165" rx="16" fill="#E8F0F6"/>
<g transform="translate(59 1629) scale(0.7)" stroke="#326B88" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 28s10-18 25-18 25 18 25 18-10 18-25 18S3 28 3 28z"/><circle cx="28" cy="28" r="8"/></g>
<text x="113" y="1653" font-size="23" font-weight="700" fill="#326B88">Plan for at-least-once delivery</text>
<text x="60" y="1692" font-size="21" font-weight="400" fill="#173D34">A lost response after an effect can leave its outcome unknown. A release</text>
<text x="60" y="1721" font-size="21" font-weight="400" fill="#173D34">alone cannot execute a task; the SDK renews authority and delivers the</text>
<text x="60" y="1750" font-size="21" font-weight="400" fill="#173D34">attempt outcome.</text><g id="takeaway">
<rect x="0" y="1824" width="960" height="90" rx="16" fill="#EAF4ED"/>
<text x="36" y="1853" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Takeaway</text>
<text x="36" y="1884" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">A current lease permits one attempt; old proofs cannot complete a new one.</text>
</g>
</svg>
