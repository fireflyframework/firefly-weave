<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1610" viewBox="0 0 960 1610" role="img" aria-labelledby="title desc">
<title id="title">A schedule starts a run; a wait stays in one</title><desc id="desc">Three timelines, read left to right. A UTC schedule on a pinned activation creates a separate new run at each future calendar instant, such as 12:00, 12:05 and 12:10; with missed_policy skip, missed minutes become skipped ranges and there is no catch-up backlog. A Wait for time step pauses the same run until its persisted deadline; when the scheduler sees it due, the step finishes as wait_elapsed with null output, and a due timer behind an incident barrier only records the elapsed fact. A Wait for signal step pauses the same run for a named, schema-checked payload; a receipt accepted strictly before the deadline continues the run, and a receipt at the deadline is too late. Database time governs live admission; offline replay uses the recorded receipts and deadline facts, not the wall clock.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.edge{stroke:#367D68;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="1510" rx="24" fill="#FAFCFB"/>
<rect x="32" y="30" width="7" height="58" rx="3" fill="#367D68"/>
<text x="58" y="58" font-size="32" font-weight="700" fill="#173D34">A schedule starts a run; a wait stays in one</text>
<text x="58" y="102" font-size="21" font-weight="400" fill="#173D34">A schedule, a Wait for time step, and a Wait for signal step</text>
<text x="58" y="131" font-size="21" font-weight="400" fill="#173D34">each follow a different time boundary.</text>
<rect x="40" y="154" width="880" height="44" rx="12" fill="#EEF4F0"/>
<text x="58" y="182" font-size="19" font-weight="600" fill="#173D34">READ EACH TIMELINE LEFT TO RIGHT  •  Each row is a different mechanism</text>
<rect x="40" y="232" width="880" height="340" rx="18" fill="white" stroke="#BFD2C8"/>
<g transform="translate(59 252) scale(0.85)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="23"/><path d="M28 13v16l11 7 M28 5v4 M5 28h4 M47 28h4"/></g>
<text x="125" y="279" font-size="26" font-weight="700" fill="#173D34">UTC schedule</text>
<text x="62" y="330" font-size="22" font-weight="400" fill="#173D34">Create separate runs at future calendar instants.</text>
<path class="edge" d="M105 392H855"/>
<circle cx="135" cy="392" r="9" fill="#367D68"/>
<text x="110" y="371" font-size="21" font-weight="700" fill="#173D34">12:00</text>
<text x="110" y="434" font-size="20" font-weight="400" fill="#173D34">New run</text>
<circle cx="438" cy="392" r="9" fill="#367D68"/>
<text x="413" y="371" font-size="21" font-weight="700" fill="#173D34">12:05</text>
<text x="413" y="434" font-size="20" font-weight="400" fill="#173D34">New run</text>
<circle cx="720" cy="392" r="9" fill="#367D68"/>
<text x="695" y="371" font-size="21" font-weight="700" fill="#173D34">12:10</text>
<text x="695" y="434" font-size="20" font-weight="400" fill="#173D34">New run</text>
<text x="62" y="489" font-size="21" font-weight="400" fill="#173D34">Pinned activation • missed_policy: skip. Missed minutes become skipped</text>
<text x="62" y="517" font-size="21" font-weight="400" fill="#173D34">ranges; no catch-up backlog.</text>
<rect x="40" y="598" width="880" height="340" rx="18" fill="white" stroke="#BFD2C8"/>
<g transform="translate(59 618) scale(0.85)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="23"/><path d="M28 13v16l11 7 M28 5v4 M5 28h4 M47 28h4"/></g>
<text x="125" y="645" font-size="26" font-weight="700" fill="#173D34">Wait for time</text>
<text x="62" y="696" font-size="22" font-weight="400" fill="#173D34">Pause the same run until its persisted duration deadline.</text>
<path class="edge" d="M105 758H855"/>
<circle cx="135" cy="758" r="9" fill="#367D68"/>
<text x="110" y="737" font-size="21" font-weight="700" fill="#173D34">Wait issued</text>
<text x="110" y="800" font-size="20" font-weight="400" fill="#173D34">Same run</text>
<circle cx="438" cy="758" r="9" fill="#367D68"/>
<text x="413" y="737" font-size="21" font-weight="700" fill="#173D34">Deadline</text>
<text x="413" y="800" font-size="20" font-weight="400" fill="#173D34">Scheduler sees due</text>
<circle cx="720" cy="758" r="9" fill="#367D68"/>
<text x="695" y="737" font-size="21" font-weight="700" fill="#173D34">wait_elapsed</text>
<text x="695" y="800" font-size="20" font-weight="400" fill="#173D34">Null output</text>
<text x="62" y="855" font-size="21" font-weight="400" fill="#173D34">A due timer behind an incident barrier records an elapsed fact; normal</text>
<text x="62" y="883" font-size="21" font-weight="400" fill="#173D34">continuation remains deferred.</text>
<rect x="40" y="964" width="880" height="340" rx="18" fill="white" stroke="#BFD2C8"/>
<g transform="translate(59 984) scale(0.85)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M28 29v24 M15 39a18 18 0 1 1 26 0 M7 46a29 29 0 1 1 42 0"/><circle cx="28" cy="27" r="4"/></g>
<text x="125" y="1011" font-size="26" font-weight="700" fill="#173D34">Wait for signal</text>
<text x="62" y="1062" font-size="22" font-weight="400" fill="#173D34">Pause the same run for a named, schema-checked payload.</text>
<path class="edge" d="M105 1124H855"/>
<circle cx="135" cy="1124" r="9" fill="#367D68"/>
<text x="110" y="1103" font-size="21" font-weight="700" fill="#173D34">Receipt arrives</text>
<text x="110" y="1166" font-size="20" font-weight="400" fill="#173D34">Before deadline</text>
<circle cx="438" cy="1124" r="9" fill="#367D68"/>
<text x="413" y="1103" font-size="21" font-weight="700" fill="#173D34">Accept signal</text>
<text x="413" y="1166" font-size="20" font-weight="400" fill="#173D34">Same run continues</text>
<circle cx="720" cy="1124" r="9" fill="#367D68"/>
<text x="695" y="1103" font-size="21" font-weight="700" fill="#173D34">Deadline</text>
<text x="695" y="1166" font-size="20" font-weight="400" fill="#173D34">Equal is too late</text>
<text x="62" y="1221" font-size="21" font-weight="400" fill="#173D34">Admission strictly before the deadline wins. A receipt at the deadline is</text>
<text x="62" y="1249" font-size="21" font-weight="400" fill="#173D34">too late; a timely signal continues the existing run.</text>
<rect x="40" y="1330" width="880" height="136" rx="16" fill="#FFF7E5"/>
<g transform="translate(59 1350) scale(0.7)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 28s10-18 25-18 25 18 25 18-10 18-25 18S3 28 3 28z"/><circle cx="28" cy="28" r="8"/></g>
<text x="113" y="1374" font-size="23" font-weight="700" fill="#367D68">Use the right clock as evidence</text>
<text x="60" y="1413" font-size="21" font-weight="400" fill="#173D34">Database time governs live admission. Offline replay uses the recorded</text>
<text x="60" y="1442" font-size="21" font-weight="400" fill="#173D34">receipts and deadline facts, not the current wall clock.</text><g id="takeaway">
<rect x="0" y="1516" width="960" height="90" rx="16" fill="#EAF4ED"/>
<text x="36" y="1545" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Takeaway</text>
<text x="36" y="1576" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Schedules create runs; waits and signals continue an existing run.</text>
</g>
</svg>
