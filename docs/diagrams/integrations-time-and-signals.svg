    <ellipse cx="145" cy="116" rx="3.3" ry="5.4" fill="#173D34"/>
    <circle cx="146" cy="113" r="1.4" fill="#FFFFFF"/>
    <path d="M106 101Q112 98 118 102M137 101Q143 98 149 102"
      fill="none" stroke="#6C997E" stroke-width="1.8" opacity=".65"/>
    <path d="M122 140Q129 143 136 139" fill="none" stroke="#84B295" stroke-width="1.5"/>
  </g>
</g></g>
<text x="110" y="1545" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="1576" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Schedules create runs; waits and signals continue an existing run.</text>
</g>
</svg>
