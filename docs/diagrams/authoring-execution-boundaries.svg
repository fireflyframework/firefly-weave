</g></g>
<text x="110" y="1443" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="1474" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Choose your boundary: offline tools, authenticated API, or explicit embedding.</text>
</g>
