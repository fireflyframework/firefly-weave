<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1680" viewBox="0 0 960 1680" role="img" aria-labelledby="title desc">
<title id="title">Keep each messaging provider’s identity intact</title><desc id="desc">Three provider rows, each read left to right. Teams: a message stores reference_id, generation and activity_id for the workflow, removal revokes the generation, and replies go only through an authorized stored reference; reactivation needs a matching new source or revision. WhatsApp: whatsapp-message carries text and whatsapp-status carries status, statuses need no earlier Weave send, delivery progress sent, delivered, read never moves backward, failed_seen and deleted_seen stay independent, and text or templates go only to allowed recipients. Telegram: a webhook secret authenticates the update, identity combines bot ID and update ID, the same facts and ID reuse a receipt while conflicts are rejected, unsupported classes are ignored, and sends go to configured chats with replies pinned to a message ID. Provider acceptance is not delivery: unknown sends need reconciliation, and these profiles and local fixtures do not certify a live account.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#62645B"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.edge{stroke:#62645B;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="1580" rx="24" fill="#F3F1EB"/>
<rect x="32" y="30" width="7" height="58" rx="3" fill="#855414"/>
<text x="58" y="58" font-size="32" font-weight="700" fill="#272820">Keep each messaging provider’s identity intact</text>
<text x="58" y="102" font-size="21" font-weight="400" fill="#272820">A shared inbox does not make provider references, lifecycle facts, or</text>
<text x="58" y="131" font-size="21" font-weight="400" fill="#272820">delivery evidence interchangeable.</text>
<rect x="40" y="154" width="880" height="44" rx="12" fill="#EAE7DF"/>
<text x="58" y="182" font-size="19" font-weight="600" fill="#272820">READ EACH ROW LEFT TO RIGHT  •  Rows show separate responsibilities</text>
<text x="48" y="242" font-size="24" font-weight="700" fill="#272820">TEAMS • An authenticated personal installation</text>
<rect x="40.0" y="263" width="420.0" height="311" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="86.0" cy="309" r="29" fill="#EAE7DF"/>
<g transform="translate(63.0 286) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="15" r="10"/><path d="M9 51V41c0-20 38-20 38 0v10"/></g>
<text x="58.0" y="366" font-size="24" font-weight="700" fill="#272820">Store a usable address</text>
<text x="58.0" y="410" font-size="22" font-weight="400" fill="#272820">A message stores reference_id,</text>
<text x="58.0" y="438" font-size="22" font-weight="400" fill="#272820">generation, and activity_id for</text>
<text x="58.0" y="466" font-size="22" font-weight="400" fill="#272820">the workflow.</text>
<text x="58.0" y="494" font-size="22" font-weight="400" fill="#272820">Removal revokes the generation;</text>
<text x="58.0" y="522" font-size="22" font-weight="400" fill="#272820">late messages cannot restore it.</text>
<path class="edge" d="M465.0 418.5h29"/>
<rect x="500.0" y="263" width="420.0" height="311" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="546.0" cy="309" r="29" fill="#EAE7DF"/>
<g transform="translate(523.0 286) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 47 21L5 49l8-21z M13 28h39"/></g>
<text x="518.0" y="366" font-size="24" font-weight="700" fill="#272820">Reply through the stored</text>
<text x="518.0" y="396" font-size="24" font-weight="700" fill="#272820">reference</text>
<text x="518.0" y="440" font-size="22" font-weight="400" fill="#272820">Explicit reactivation needs a</text>
<text x="518.0" y="468" font-size="22" font-weight="400" fill="#272820">matching new source/revision.</text>
<text x="518.0" y="496" font-size="22" font-weight="400" fill="#272820">Only an authorized stored</text>
<text x="518.0" y="524" font-size="22" font-weight="400" fill="#272820">reference can be used; no</text>
<text x="518.0" y="552" font-size="22" font-weight="400" fill="#272820">conversation bootstrap.</text>
<text x="48" y="632" font-size="24" font-weight="700" fill="#272820">WHATSAPP • Messages and status events both dispatch</text>
<rect x="40.0" y="653" width="420.0" height="309" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="86.0" cy="699" r="29" fill="#EAE7DF"/>
<g transform="translate(63.0 676) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M28 29v24 M15 39a18 18 0 1 1 26 0 M7 46a29 29 0 1 1 42 0"/><circle cx="28" cy="27" r="4"/></g>
<text x="58.0" y="756" font-size="24" font-weight="700" fill="#272820">Normalize two event kinds</text>
<text x="58.0" y="800" font-size="22" font-weight="400" fill="#272820">whatsapp-message carries text.</text>
<text x="58.0" y="828" font-size="22" font-weight="400" fill="#272820">whatsapp-status carries status.</text>
<text x="58.0" y="856" font-size="22" font-weight="400" fill="#272820">Statuses need no earlier Weave</text>
<text x="58.0" y="884" font-size="22" font-weight="400" fill="#272820">send.</text>
<path class="edge" d="M465.0 807.5h29"/>
<rect x="500.0" y="653" width="420.0" height="309" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="546.0" cy="699" r="29" fill="#EAE7DF"/>
<g transform="translate(523.0 676) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="23"/><path d="m14 28 10 10 19-22"/></g>
<text x="518.0" y="756" font-size="24" font-weight="700" fill="#272820">Retain delivery progress</text>
<text x="518.0" y="800" font-size="22" font-weight="400" fill="#272820">Progress sent → delivered → read</text>
<text x="518.0" y="828" font-size="22" font-weight="400" fill="#272820">never moves backward.</text>
<text x="518.0" y="856" font-size="22" font-weight="400" fill="#272820">failed_seen and deleted_seen stay</text>
<text x="518.0" y="884" font-size="22" font-weight="400" fill="#272820">independent.</text>
<text x="518.0" y="912" font-size="22" font-weight="400" fill="#272820">Send text/templates to allowed</text>
<text x="518.0" y="940" font-size="22" font-weight="400" fill="#272820">recipients.</text>
<text x="48" y="1020" font-size="24" font-weight="700" fill="#272820">TELEGRAM • Pin the bot and allowed chats</text>
<rect x="40.0" y="1041" width="420.0" height="311" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="86.0" cy="1087" r="29" fill="#EAE7DF"/>
<g transform="translate(63.0 1064) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m28 4 20 8v16c0 14-20 25-20 25S8 42 8 28V12z M17 28l8 8 15-18"/></g>
<text x="58.0" y="1144" font-size="24" font-weight="700" fill="#272820">Authenticate the update</text>
<text x="58.0" y="1188" font-size="22" font-weight="400" fill="#272820">Webhook secret verifies the</text>
<text x="58.0" y="1216" font-size="22" font-weight="400" fill="#272820">source.</text>
<text x="58.0" y="1244" font-size="22" font-weight="400" fill="#272820">Identity combines bot ID and</text>
<text x="58.0" y="1272" font-size="22" font-weight="400" fill="#272820">update ID.</text>
<text x="58.0" y="1300" font-size="22" font-weight="400" fill="#272820">Human text can dispatch.</text>
<path class="edge" d="M465.0 1196.5h29"/>
<rect x="500.0" y="1041" width="420.0" height="311" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="546.0" cy="1087" r="29" fill="#EAE7DF"/>
<g transform="translate(523.0 1064) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 47 21L5 49l8-21z M13 28h39"/></g>
<text x="518.0" y="1144" font-size="24" font-weight="700" fill="#272820">Preserve source-local</text>
<text x="518.0" y="1174" font-size="24" font-weight="700" fill="#272820">receipts</text>
<text x="518.0" y="1218" font-size="22" font-weight="400" fill="#272820">Same facts and ID reuse a receipt;</text>
<text x="518.0" y="1246" font-size="22" font-weight="400" fill="#272820">conflicts reject.</text>
<text x="518.0" y="1274" font-size="22" font-weight="400" fill="#272820">Unsupported classes are ignored.</text>
<text x="518.0" y="1302" font-size="22" font-weight="400" fill="#272820">Send to configured chats; replies</text>
<text x="518.0" y="1330" font-size="22" font-weight="400" fill="#272820">pin a message ID.</text>
<rect x="40" y="1400" width="880" height="136" rx="16" fill="#FFF0D8"/>
<g transform="translate(59 1420) scale(0.7)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 28s10-18 25-18 25 18 25 18-10 18-25 18S3 28 3 28z"/><circle cx="28" cy="28" r="8"/></g>
<text x="113" y="1444" font-size="23" font-weight="700" fill="#855414">Provider acceptance is not delivery</text>
<text x="60" y="1483" font-size="21" font-weight="400" fill="#272820">Unknown sends need reconciliation. These profiles and local fixtures do not</text>
<text x="60" y="1512" font-size="21" font-weight="400" fill="#272820">certify a live account or installation.</text><g id="takeaway">
<rect x="0" y="1586" width="960" height="90" rx="16" fill="#EAE7DF"/>
<text x="36" y="1615" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#855414">Takeaway</text>
<text x="36" y="1646" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#272820">Preserve each provider’s own reference, receipt and status identities.</text>
</g>
</svg>
