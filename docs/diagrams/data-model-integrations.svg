<text x="60" y="815" class="body">Parent key: E, id</text>
<rect x="610" y="750" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="630" y="784" class="head">whatsapp_status_facts</text>
