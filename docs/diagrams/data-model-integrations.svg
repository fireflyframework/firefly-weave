<path class="edge" d="M513 799L606 799"/>
<text x="531" y="778" class="small">0..*</text>
<text x="40" y="884" class="small">Sources: migrations 0017–0020. Outbox delivery also references a subscription and its source binding.</text>
<text x="40" y="912" class="small">WhatsApp observations link source, fact and connection revision; Teams lifecycle events reference a reference.</text>
<text x="40" y="940" class="small">Broker routes/events/receipts use their own scoped FKs (0016). These maps are not retention eligibility rules.</text>

