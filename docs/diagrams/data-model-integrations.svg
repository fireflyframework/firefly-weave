<text x="608" y="475" class="code">provider_receipts</text>
<text x="572" y="514" class="code">FK: E, source_id</text>
<path class="edge" d="M408 489H552"/>
<text x="480" y="471" class="head" text-anchor="middle">0..*</text>
<text x="480" y="522" class="small muted" text-anchor="middle">receipts</text>
<rect x="36" y="569" width="372" height="102" rx="12" fill="white" stroke="#a8bdb1"/>
<rect x="552" y="569" width="372" height="102" rx="12" fill="#eaf4ed"/>
<g transform="translate(51,588) scale(0.9615384615384616)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="92" y="602" class="code">provider_receipts</text>
<text x="56" y="641" class="code">Key: E, source_id, id</text>
<g transform="translate(567,588) scale(0.9615384615384616)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="608" y="602" class="code">provider_intents</text>
<text x="572" y="641" class="code">FK: E, source_id, receipt_id</text>
<path class="edge" d="M408 616H552"/>
<text x="480" y="598" class="head" text-anchor="middle">0..1</text>
<text x="480" y="649" class="small muted" text-anchor="middle">intent</text>
<rect x="36" y="696" width="372" height="102" rx="12" fill="white" stroke="#a8bdb1"/>
<rect x="552" y="696" width="372" height="102" rx="12" fill="#eaf4ed"/>
<g transform="translate(51,715) scale(0.9615384615384616)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="92" y="729" class="code">provider_sources</text>
<text x="56" y="768" class="code">Key: E, id</text>
<g transform="translate(567,715) scale(0.9615384615384616)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="608" y="729" class="code">teams_references</text>
<text x="572" y="768" class="code">FK: E, source_id</text>
<path class="edge" d="M408 743H552"/>
<text x="480" y="725" class="head" text-anchor="middle">0..*</text>
<text x="480" y="776" class="small muted" text-anchor="middle">references</text>
<rect x="36" y="823" width="372" height="102" rx="12" fill="white" stroke="#a8bdb1"/>
<rect x="552" y="823" width="372" height="102" rx="12" fill="#eaf4ed"/>
<g transform="translate(51,842) scale(0.9615384615384616)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="92" y="856" class="code">whatsapp_message_states</text>
<text x="56" y="895" class="code">Key: E, id</text>
<g transform="translate(567,842) scale(0.9615384615384616)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="608" y="856" class="code">whatsapp_status_facts</text>
<text x="572" y="895" class="code">FK: E, state_id</text>
<path class="edge" d="M408 870H552"/>
<text x="480" y="852" class="head" text-anchor="middle">0..*</text>
<text x="480" y="903" class="small muted" text-anchor="middle">facts</text>
<text x="36" y="970" class="small muted">Migrations 0017–0020. Deliveries also reference subscriptions; provider sources reference</text>
<text x="36" y="996" class="small muted">source bindings and one activation or run. WhatsApp observations join source, fact, and</text>
<text x="36" y="1022" class="small muted">connection revision. Broker receipts have separate FKs (0016). This view does not decide retention.</text>
<g id="takeaway">
<rect x="0" y="1098" width="960" height="90" rx="16" fill="#EAF4ED"/>
<text x="36" y="1127" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Takeaway</text>
<text x="36" y="1158" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Event, receipt, and delivery-attempt identities describe different facts.</text>
</g>
</svg>
