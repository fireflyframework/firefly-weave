<text x="56" y="895" class="code">Key: E, id</text>
<g transform="translate(567,842) scale(0.9615384615384616)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="608" y="856" class="code">whatsapp_status_facts</text>
<text x="572" y="895" class="code">FK: E, state_id</text>
<path class="edge" d="M408 870H552"/>
<text x="480" y="852" class="head" text-anchor="middle">0..*</text>
<text x="480" y="903" class="small muted" text-anchor="middle">facts</text>
<text x="36" y="970" class="small muted">Migrations 0017–0020. Deliveries also reference subscriptions; provider sources reference</text>
<text x="36" y="996" class="small muted">source bindings and one activation or run. WhatsApp observations join source, fact, and</text>
<text x="36" y="1022" class="small muted">connection revision. Broker receipts have separate FKs (0016). This view does not decide retention.</text>
