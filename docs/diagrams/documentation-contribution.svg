<text x="58" y="553" class="body white" text-anchor="middle">4</text>
<g transform="translate(111,528) scale(1.3846153846153846)" fill="none" stroke="#62645B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0 12Q12 -4 24 12Q12 28 0 12Z M16 12A4 4 0 1 1 8 12A4 4 0 1 1 16 12"/></g>
<text x="170" y="556" class="head">Inspect it as a reader</text>
<text x="111" y="596" class="body">Render at article width; check labels, arrows, and captions.</text>
<text x="111" y="625" class="body">Follow the chapter using only its stated prerequisites.</text>
<text x="36" y="715" class="small muted">A passing link check cannot prove accuracy. A diagram must not invent a guarantee.</text>
<g id="takeaway">
<rect x="0" y="766" width="960" height="90" rx="16" fill="#EAE7DF"/>
