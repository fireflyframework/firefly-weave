<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="title desc">
<title id="title">Teach a behavior the reader can verify</title><desc id="desc">Four steps read from top to bottom. 1, establish what really happens: read the public contract and implementation, and identify services, IDs, authority, and what the example proves. 2, explain the task in order: show the steps, the expected output, and a useful diagram, using the same names as the commands and API. 3, execute the checks: run scripts/source_coverage.py --strict, scripts/check_docs.py, mkdocs build --strict, and the real example, and keep private evidence out of published pages. 4, inspect it as a reader: render at article width, check labels, arrows, and captions, and follow the chapter using only its stated prerequisites. A passing link check cannot prove accuracy, and a diagram must not invent a guarantee.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62645B"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#272820}.title{font-size:31px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.code{font-family:Menlo,Consolas,monospace;font-size:17px}.muted{fill:#62645B}.edge{fill:none;stroke:#62645B;stroke-width:2.5;marker-end:url(#arrow)}.white{fill:white}</style>
<rect width="960" height="760" rx="16" fill="#F3F1EB"/>
<path d="M36 99H924" stroke="#D8D4CA"/>
<text x="36" y="46" class="title">Teach a behavior the reader can verify</text>
<text x="36" y="79" class="body muted">Keep the source, explanation, example, and picture in agreement.</text>
