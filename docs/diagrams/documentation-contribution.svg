<text x="58" y="151" class="body white" text-anchor="middle">1</text>
<g transform="translate(111,126) scale(1.3846153846153846)" fill="none" stroke="#62645B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3A7 7 0 1 1 10 17A7 7 0 1 1 10 3Z M15 15L22 22"/></g>
<text x="170" y="154" class="head">Establish what really happens</text>
<text x="111" y="194" class="body">Read the public contract and implementation.</text>
<text x="111" y="223" class="body">Identify services, IDs, authority, and what the example proves.</text>
<path class="edge" d="M58 170V233"/>
<circle cx="58" cy="278" r="19" fill="#855414"/>
<text x="58" y="285" class="body white" text-anchor="middle">2</text>
<g transform="translate(111,260) scale(1.3846153846153846)" fill="none" stroke="#62645B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1H15L21 7V23H5Z M15 1V7H21 M9 12H17 M9 17H17"/></g>
<text x="170" y="288" class="head">Explain the task in order</text>
<text x="111" y="328" class="body">Show the steps, the expected output, and a useful diagram.</text>
<text x="111" y="357" class="body">Use the same names as the commands and API.</text>
<path class="edge" d="M58 304V367"/>
<circle cx="58" cy="412" r="19" fill="#855414"/>
<text x="58" y="419" class="body white" text-anchor="middle">3</text>
<g transform="translate(111,394) scale(1.3846153846153846)" fill="none" stroke="#62645B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L9 18L21 5"/></g>
<text x="170" y="422" class="head">Execute the checks</text>
<text x="111" y="462" class="body">Run source_coverage.py --strict, check_docs.py, mkdocs build --strict,</text>
<text x="111" y="491" class="body">and the real example. Keep private evidence out of published pages.</text>
