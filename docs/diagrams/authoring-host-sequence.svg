<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">Carry returned identities into the next request</title>
<desc id="desc">A host saves a draft using an expected revision, publishes source with an idempotency key, activates the returned version and digest, and starts a run from the activation. The API returns typed identities and checks current authorization for each request.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#507767"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#16372a}.title{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:18px}.edge{fill:none;stroke:#507767;stroke-width:2.5;marker-end:url(#arrow)}.return{fill:none;stroke:#507767;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
<rect width="1120" height="900" rx="20" fill="#f7faf5"/>
<text class="title" x="40" y="54">Carry returned identities into the next request</text>
<text class="body" x="40" y="86">Happy path after identity and grants are provisioned; draft saving is optional.</text>
<rect x="50" y="117" width="210" height="57" rx="14" fill="#edf4e8" stroke="#adc5b5" stroke-width="1.5"/>
<text class="label" x="155" y="153" text-anchor="middle">Host / SDK</text>
<rect x="655" y="117" width="205" height="57" rx="14" fill="#edf4e8" stroke="#adc5b5" stroke-width="1.5"/>
<text class="label" x="757" y="153" text-anchor="middle">Weave API</text>
<text class="label" x="910" y="152">Server checks</text>
<path d="M155 174 V776 M757 174 V776" stroke="#adc5b5" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<text class="body" x="178" y="218">save_draft(document, revision)</text>
<path class="edge" d="M155 233 H757"/>
<text class="body" x="178" y="281">draft ID + new revision</text>
<path class="return" d="M757 296 H155"/>
<rect x="884" y="210" width="196" height="89" rx="14" fill="#ffffff" stroke="#adc5b5" stroke-width="1.5"/>
<text class="small" x="899" y="243">Current grant</text>
<text class="small" x="899" y="271">Expected revision</text>
<text class="body" x="178" y="361">publish(source, key)</text>
<path class="edge" d="M155 376 H757"/>
<text class="body" x="178" y="424">version ID + digest</text>
<path class="return" d="M757 439 H155"/>
<rect x="884" y="353" width="196" height="89" rx="14" fill="#ffffff" stroke="#adc5b5" stroke-width="1.5"/>
<text class="small" x="899" y="386">Current grant</text>
<text class="small" x="899" y="414">Server catalog</text>
<text class="body" x="178" y="504">activate(version ID, digest, key)</text>
<path class="edge" d="M155 519 H757"/>
<text class="body" x="178" y="567">activation ID + revision</text>
<path class="return" d="M757 582 H155"/>
<rect x="884" y="496" width="196" height="89" rx="14" fill="#ffffff" stroke="#adc5b5" stroke-width="1.5"/>
<text class="small" x="899" y="529">Current grant</text>
<text class="small" x="899" y="557">Pinned bindings</text>
<text class="body" x="178" y="647">start_run(activation ID, input, key)</text>
<path class="edge" d="M155 662 H757"/>
<text class="body" x="178" y="710">run ID + current state</text>
<path class="return" d="M757 725 H155"/>
<rect x="884" y="639" width="196" height="89" rx="14" fill="#ffffff" stroke="#adc5b5" stroke-width="1.5"/>
<text class="small" x="899" y="672">Current grant</text>
<text class="small" x="899" y="700">Input schema</text>
<rect x="40" y="795" width="1040" height="75" rx="14" fill="#f5eee2" stroke="#adc5b5" stroke-width="1.5"/>
<text class="body" x="60" y="825">Keep each returned ID. Scope selects resources; the token and local grants supply authority.</text>
<text class="body" x="60" y="853">A lost mutation response leaves the outcome unknown: preserve its exact request and key.</text>
</svg>
