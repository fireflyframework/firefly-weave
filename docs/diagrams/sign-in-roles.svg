  </g>
</g></g>
<text x="110" y="1191" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="1222" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Sign-in proves who you are. Only the platform’s grants decide what you may do.</text>
</g>
</svg>
