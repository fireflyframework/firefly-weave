<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 870" role="img" aria-labelledby="title desc">
<title id="title">Find the boundary, then choose the evidence</title><desc id="desc">Diagnostic rows map dependencies, readiness, identity, execution and external effects to appropriate evidence. A separate panel shows best-effort telemetry cannot replace durable receipts.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173D34}.title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.line{fill:none;stroke:#C9DBD2;stroke-width:2}</style>
<rect width="1120" height="870" fill="#FFFFFF"/>
<text x="40" y="52" class="title">Find the boundary, then choose the evidence</text>
<text x="40" y="88" class="body">Move downward only after the preceding boundary has enough evidence.</text>
<text x="95" y="135" class="head">QUESTION</text>
<text x="545" y="135" class="head">EVIDENCE TO INSPECT</text>
<circle cx="61" cy="191" r="21" fill="#D8EEE4" stroke="#367D68"/>
<text x="61" y="197" class="head" text-anchor="middle">1</text>
<rect x="95" y="157" width="985" height="86" rx="12" fill="#F6F8F5" stroke="#C9DBD2" stroke-width="1.5"/>
<text x="113" y="190" class="head">Can dependencies answer?</text>
<text x="545" y="188" class="body">Owned PostgreSQL health + Keycloak discovery</text>
<text x="545" y="217" class="body">Same context, project, port and network namespace</text>
<path d="M61 212V237" class="edge"/>
<circle cx="61" cy="294" r="21" fill="#D8EEE4" stroke="#367D68"/>
<text x="61" y="300" class="head" text-anchor="middle">2</text>
<rect x="95" y="260" width="985" height="86" rx="12" fill="#F6F8F5" stroke="#C9DBD2" stroke-width="1.5"/>
<text x="113" y="293" class="head">Can this replica accept work?</text>
<text x="545" y="291" class="body">Readiness + complete scoped compatibility report</text>
<text x="545" y="320" class="body">Schema, catalog authority, persisted requirements, policy</text>
<path d="M61 315V340" class="edge"/>
<circle cx="61" cy="397" r="21" fill="#D8EEE4" stroke="#367D68"/>
<text x="61" y="403" class="head" text-anchor="middle">3</text>
<rect x="95" y="363" width="985" height="86" rx="12" fill="#F6F8F5" stroke="#C9DBD2" stroke-width="1.5"/>
<text x="113" y="396" class="head">Is this operation authorized?</text>
<text x="545" y="394" class="body">Token checks → active identity link → scoped grant</text>
<text x="545" y="423" class="body">Protected decision log, safe code and request ID</text>
<path d="M61 418V443" class="edge"/>
<circle cx="61" cy="500" r="21" fill="#D8EEE4" stroke="#367D68"/>
<text x="61" y="506" class="head" text-anchor="middle">4</text>
<rect x="95" y="466" width="985" height="86" rx="12" fill="#F6F8F5" stroke="#C9DBD2" stroke-width="1.5"/>
<text x="113" y="499" class="head">What did the runtime record?</text>
<text x="545" y="497" class="body">Authorized run state, history, leases and incidents</text>
<text x="545" y="526" class="body">Pinned release / connection and accepted completion</text>
<path d="M61 521V546" class="edge"/>
<circle cx="61" cy="603" r="21" fill="#D8EEE4" stroke="#367D68"/>
<text x="61" y="609" class="head" text-anchor="middle">5</text>
<rect x="95" y="569" width="985" height="86" rx="12" fill="#F6F8F5" stroke="#C9DBD2" stroke-width="1.5"/>
<text x="113" y="602" class="head">What happened outside Weave?</text>
<text x="545" y="600" class="body">Independent receiver or provider receipts</text>
<text x="545" y="629" class="body">Unknown effects may need reconciliation before retry</text>
<rect x="40" y="708" width="1040" height="116" rx="12" fill="#D8EEE4" stroke="#C9DBD2" stroke-width="1.5"/>
<text x="60" y="742" class="head">Telemetry is a parallel observation path</text>
<text x="60" y="773" class="body">Explicit WEAVE_TELEMETRY → owned providers → bounded export → collector.</text>
<text x="60" y="800" class="body">Disabled by default; dropped spans do not erase durable state or prove an effect never occurred.</text>
</svg>
