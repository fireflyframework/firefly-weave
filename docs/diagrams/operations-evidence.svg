<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1679" viewBox="0 0 960 1679" role="img" aria-labelledby="title desc">
<title id="title">Find the failing boundary before retrying</title><desc id="desc">Move to the next question only after you have enough evidence for the preceding one. READ DOWN  •  Each arrow carries the result into the next step</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.edge{stroke:#367D68;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="1579" rx="24" fill="#FAFCFB"/>
<rect x="32" y="30" width="7" height="58" rx="3" fill="#367D68"/>
<text x="58" y="58" font-size="32" font-weight="700" fill="#173D34">Find the failing boundary before retrying</text>
<text x="58" y="102" font-size="21" font-weight="400" fill="#173D34">Move to the next question only after you have enough evidence for the</text>
<text x="58" y="131" font-size="21" font-weight="400" fill="#173D34">preceding one.</text>
<rect x="40" y="154" width="880" height="44" rx="12" fill="#EEF4F0"/>
<text x="58" y="182" font-size="19" font-weight="600" fill="#173D34">READ DOWN  •  Each arrow carries the result into the next step</text>
<rect x="40" y="232" width="880" height="187" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="249" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 264) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 43C-2 43-2 20 13 19 17 1 42 4 44 22 59 25 54 43 42 43z M28 20v30 M20 42l8 8 8-8"/></g>
<text x="168" y="275" font-size="25" font-weight="700" fill="#173D34">1. Can the dependencies answer?</text>
<text x="168" y="314" font-size="22" font-weight="400" fill="#173D34">Check owned PostgreSQL health and Keycloak discovery.</text>
<text x="168" y="343" font-size="22" font-weight="400" fill="#173D34">Use the same context, project, port, and network namespace as</text>
<text x="168" y="372" font-size="22" font-weight="400" fill="#173D34">the failing process.</text>
<text x="168" y="401" font-size="18" font-weight="600" fill="#326B88">DEPENDENCIES • Reachability is only the first check</text>
<path class="edge" d="M480 423v35"/>
<rect x="40" y="471" width="880" height="216" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="488" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 503) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="23"/><path d="m14 28 10 10 19-22"/></g>
<text x="168" y="514" font-size="25" font-weight="700" fill="#173D34">2. Can this replica accept work?</text>
<text x="168" y="553" font-size="22" font-weight="400" fill="#173D34">Inspect readiness and the complete scoped compatibility</text>
<text x="168" y="582" font-size="22" font-weight="400" fill="#173D34">report.</text>
<text x="168" y="611" font-size="22" font-weight="400" fill="#173D34">Check schema, catalog authority, persisted requirements, and</text>
<text x="168" y="640" font-size="22" font-weight="400" fill="#173D34">policy.</text>
<text x="168" y="669" font-size="18" font-weight="600" fill="#326B88">READINESS • A running process may not be ready</text>
<path class="edge" d="M480 691v35"/>
<rect x="40" y="739" width="880" height="158" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="756" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 771) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m28 4 20 8v16c0 14-20 25-20 25S8 42 8 28V12z M17 28l8 8 15-18"/></g>
<text x="168" y="782" font-size="25" font-weight="700" fill="#173D34">3. Is this operation authorized?</text>
<text x="168" y="821" font-size="22" font-weight="400" fill="#173D34">Follow token checks → active identity link → scoped grant.</text>
<text x="168" y="850" font-size="22" font-weight="400" fill="#173D34">Use protected decision logs, safe error code, and request ID.</text>
<text x="168" y="879" font-size="18" font-weight="600" fill="#326B88">AUTHORIZATION • Do not infer grants from a successful login</text>
<path class="edge" d="M480 901v35"/>
<rect x="40" y="949" width="880" height="158" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="966" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 981) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="28" cy="12" rx="21" ry="8"/><path d="M7 12v32c0 11 42 11 42 0V12 M7 28c0 11 42 11 42 0"/></g>
<text x="168" y="992" font-size="25" font-weight="700" fill="#173D34">4. What did Weave record?</text>
<text x="168" y="1031" font-size="22" font-weight="400" fill="#173D34">Read authorized run state, history, leases, and incidents.</text>
<text x="168" y="1060" font-size="22" font-weight="400" fill="#173D34">Check pinned release/connection and accepted completion.</text>
<text x="168" y="1089" font-size="18" font-weight="600" fill="#326B88">DURABLE FACTS • Match the exact run and task attempt</text>
<path class="edge" d="M480 1111v35"/>
<rect x="40" y="1159" width="880" height="187" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<rect x="56" y="1176" width="90" height="90" rx="20" fill="#EEF4F0"/>
<g transform="translate(73 1191) scale(1)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 28s10-18 25-18 25 18 25 18-10 18-25 18S3 28 3 28z"/><circle cx="28" cy="28" r="8"/></g>
<text x="168" y="1202" font-size="25" font-weight="700" fill="#173D34">5. What happened outside Weave?</text>
<text x="168" y="1241" font-size="22" font-weight="400" fill="#173D34">Inspect independent receiver or provider receipts.</text>
<text x="168" y="1270" font-size="22" font-weight="400" fill="#173D34">Unknown effects may need reconciliation before another</text>
<text x="168" y="1299" font-size="22" font-weight="400" fill="#173D34">attempt.</text>
<text x="168" y="1328" font-size="18" font-weight="600" fill="#326B88">EXTERNAL FACTS • A timeout does not prove no effect occurred</text>
<rect x="40" y="1370" width="880" height="165" rx="16" fill="#E8F0F6"/>
<g transform="translate(59 1390) scale(0.7)" stroke="#326B88" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 28s10-18 25-18 25 18 25 18-10 18-25 18S3 28 3 28z"/><circle cx="28" cy="28" r="8"/></g>
<text x="113" y="1414" font-size="23" font-weight="700" fill="#326B88">Telemetry is a parallel observation path</text>
<text x="60" y="1453" font-size="21" font-weight="400" fill="#173D34">Explicit WEAVE_TELEMETRY enables owned providers and bounded export to a</text>
<text x="60" y="1482" font-size="21" font-weight="400" fill="#173D34">collector. It is off by default; dropped spans do not erase durable facts or</text>
<text x="60" y="1511" font-size="21" font-weight="400" fill="#173D34">prove an effect never occurred.</text><g id="lumi-takeaway">
<rect x="0" y="1585" width="960" height="90" rx="16" fill="#EAF4ED"/>
<g transform="translate(22 1596) scale(.25)"><defs>
  <radialGradient id="lumi-face" cx=".3" cy=".2" r=".9">
    <stop stop-color="#3C6957"/><stop offset=".55" stop-color="#1C463A"/>
    <stop offset="1" stop-color="#102E28"/>
  </radialGradient>
  <linearGradient id="lumi-eye" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8DCC8"/>
  </linearGradient>
  <linearGradient id="lumi-lantern" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFEDAD"/><stop offset="1" stop-color="#DDA743"/></linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <path d="M113 89C109 67 100 51 89 45M143 89C147 67 156 51 167 45" fill="none" stroke="#315C4E" stroke-width="3.5"/>
  <path d="M102 134Q128 122 154 134L153 184C153 206 142 219 128 219C114 219 103 206 103 184Z" fill="#173D34"/>
  <path d="M107 177Q128 185 149 177L148 191C146 205 138 213 128 213C118 213 110 205 108 191Z" fill="url(#lumi-lantern)"/>
  <path d="M30 83L56 61Q61 57 66 64L142 174L130 193L28 91Q24 86 30 83Z" fill="#173D34"/>
  <path d="M57 63L135 175L129 185L30 87Z" fill="#78B89C"/>
  <path d="M57 63L96 119L72 111L30 87Z" fill="#C7E6D7"/>
  <path d="M72 111L96 119L135 175L129 185Z" fill="#4F9479"/>
  <path d="M226 83L200 61Q195 57 190 64L111 178L127 194L228 91Q232 86 226 83Z" fill="#173D34"/>
  <path d="M199 63L116 178L127 187L226 87Z" fill="#A1D1B9"/>
  <path d="M199 63L160 119L184 111L226 87Z" fill="#D8EEE3"/>
  <path d="M184 111L160 119L116 178L127 187Z" fill="#68AA8D"/>
  <g transform="rotate(-5 128 120)">
    <path d="M94 115C93 95 108 81 128 81C148 81 163 95 162 115
      C162 135 150 152 130 158C109 155 95 138 94 115Z" fill="url(#lumi-face)"/>
    <path d="M98 111C98 96 110 86 124 85" fill="none" stroke="#83AF94"
      stroke-width="1.2" opacity=".5"/>
    <path d="M128 87C124 99 124 106 126 112" fill="none" stroke="#58856B"
      stroke-width="1" opacity=".4"/>
    <path d="M103 114C104 106 111 103 117 107C124 111 124 120 119 126
      C111 131 104 124 103 114Z" fill="#0C2923"/>
    <path d="M105 114C106 109 111 107 116 110C120 113 121 120 117 124
      C111 127 106 122 105 114Z" fill="url(#lumi-eye)"/>
    <ellipse cx="114.5" cy="116.5" rx="3.3" ry="5.4" fill="#173D34"/>
    <circle cx="115.5" cy="113.5" r="1.4" fill="#FFFFFF"/>
    <path d="M135 112C138 105 145 103 151 108C156 114 153 124 147 127
      C139 129 133 120 135 112Z" fill="#0C2923"/>
    <path d="M137 113C139 108 144 107 148 110C152 114 150 121 146 124
      C140 126 136 120 137 113Z" fill="url(#lumi-eye)"/>
    <ellipse cx="145" cy="116" rx="3.3" ry="5.4" fill="#173D34"/>
    <circle cx="146" cy="113" r="1.4" fill="#FFFFFF"/>
    <path d="M106 101Q112 98 118 102M137 101Q143 98 149 102"
      fill="none" stroke="#6C997E" stroke-width="1.8" opacity=".65"/>
    <path d="M122 140Q129 143 136 139" fill="none" stroke="#84B295" stroke-width="1.5"/>
  </g>
</g></g>
<text x="110" y="1614" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="1645" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Find the failed boundary before retrying a request or external effect.</text>
</g>
</svg>
