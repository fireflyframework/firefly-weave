<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1377" viewBox="0 0 960 1377" role="img" aria-labelledby="title desc">
<title id="title">Turn installed code into an executable workflow</title><desc id="desc">Two rows, each read left to right. Row 1, choose the code, then describe what workflows may call: an operator installs a trusted Python package (an exact distribution and entry point with its services, an optional verifier, and fixtures), and installing it does not enable it; the built-in weave-http@2.0.0 connector skips this step because it ships with every server. An author then publishes contracts: a Connector defines operations, an Action selects one, and a Workflow calls the Action, with schemas and effects pinned and IDs returned. Row 2, bind those contracts to a prepared environment: an operator supplies authority with a connection revision (config, secret handles, and destinations), a release that binds capabilities, and scoped grants; on the local platform, weave platform integrations enable and weave platform integrations grant do this. Activation then joins exact versions: each connection slot maps to a connection revision ID and each Connector version ID to an admitted release ID, and the release still needs current authority. Package validation checks contracts and native tests check composition; neither proves a provider account, live access, or successful delivery. Credentials stay outside workflow input.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#62645B"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.edge{stroke:#62645B;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="1277" rx="24" fill="#F3F1EB"/>
<rect x="32" y="30" width="7" height="58" rx="3" fill="#855414"/>
<text x="58" y="58" font-size="32" font-weight="700" fill="#272820">Turn installed code into an executable workflow</text>
<text x="58" y="102" font-size="21" font-weight="400" fill="#272820">Installation, publication, and environment permission answer different</text>
<text x="58" y="131" font-size="21" font-weight="400" fill="#272820">questions.</text>
<rect x="40" y="154" width="880" height="44" rx="12" fill="#EAE7DF"/>
<text x="58" y="182" font-size="19" font-weight="600" fill="#272820">READ EACH ROW LEFT TO RIGHT  •  Rows show separate responsibilities</text>
<text x="48" y="242" font-size="24" font-weight="700" fill="#272820">1 • Choose the code, then describe what workflows may call</text>
<rect x="40.0" y="263" width="420.0" height="339" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="86.0" cy="309" r="29" fill="#EAE7DF"/>
<g transform="translate(63.0 286) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m6 16 22-11 22 11v25L28 52 6 41z M6 16l22 12 22-12 M28 28v24 M17 11l22 11"/></g>
<text x="58.0" y="366" font-size="24" font-weight="700" fill="#272820">Operator installs trusted</text>
<text x="58.0" y="396" font-size="24" font-weight="700" fill="#272820">Python</text>
<text x="58.0" y="440" font-size="22" font-weight="400" fill="#272820">Select an exact distribution and</text>
<text x="58.0" y="468" font-size="22" font-weight="400" fill="#272820">entry point; declare its services,</text>
<text x="58.0" y="496" font-size="22" font-weight="400" fill="#272820">an optional verifier, and fixtures.</text>
<text x="58.0" y="524" font-size="22" font-weight="400" fill="#272820">Installing it does not enable it.</text>
<text x="58.0" y="556" font-size="18" font-weight="600" fill="#4A5D65">Built-in weave-http@2.0.0 skips this:</text>
<text x="58.0" y="582" font-size="18" font-weight="600" fill="#4A5D65">it ships with every server.</text>
<path class="edge" d="M465.0 432.5h29"/>
<rect x="500.0" y="263" width="420.0" height="339" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="546.0" cy="309" r="29" fill="#EAE7DF"/>
<g transform="translate(523.0 286) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h20l11 11v35H12z M32 5v12h11 M20 27h15 M20 35h15 M20 43h10"/></g>
<text x="518.0" y="366" font-size="24" font-weight="700" fill="#272820">Author publishes contracts</text>
<text x="518.0" y="410" font-size="22" font-weight="400" fill="#272820">A Connector defines operations; an</text>
<text x="518.0" y="438" font-size="22" font-weight="400" fill="#272820">Action selects one, and a Workflow</text>
<text x="518.0" y="466" font-size="22" font-weight="400" fill="#272820">calls the Action. Schemas and effects</text>
<text x="518.0" y="494" font-size="22" font-weight="400" fill="#272820">are pinned; publication returns IDs.</text>
<text x="48" y="660" font-size="24" font-weight="700" fill="#272820">2 • Bind those contracts to a prepared environment</text>
<rect x="40.0" y="681" width="420.0" height="339" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="86.0" cy="727" r="29" fill="#EAE7DF"/>
<g transform="translate(63.0 704) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="19" r="12"/><path d="m27 28 22 22 M36 37l7-7 M43 44l7-7"/></g>
<text x="58.0" y="784" font-size="24" font-weight="700" fill="#272820">Operator supplies authority</text>
<text x="58.0" y="828" font-size="22" font-weight="400" fill="#272820">A connection revision fixes config,</text>
<text x="58.0" y="856" font-size="22" font-weight="400" fill="#272820">secret handles, and destinations.</text>
<text x="58.0" y="884" font-size="22" font-weight="400" fill="#272820">A release binds capabilities; scoped</text>
<text x="58.0" y="912" font-size="22" font-weight="400" fill="#272820">grants permit the work.</text>
<text x="58.0" y="948" font-size="18" font-weight="600" fill="#4A5D65">On the local platform, run:</text>
<text x="58.0" y="974" font-size="18" font-weight="600" fill="#4A5D65">weave platform integrations enable</text>
<text x="58.0" y="1000" font-size="18" font-weight="600" fill="#4A5D65">weave platform integrations grant</text>
<path class="edge" d="M465.0 850.5h29"/>
<rect x="500.0" y="681" width="420.0" height="339" rx="18" fill="white" stroke="#D8D4CA" stroke-width="2"/>
<circle cx="546.0" cy="727" r="29" fill="#EAE7DF"/>
<g transform="translate(523.0 704) scale(0.82)" stroke="#62645B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m19 35-5 5c-14 14-28-1-14-14l10-10c10-10 23-2 19 7 M36 21l5-5c14-14 28 1 14 14L45 40c-10 10-23 2-19-7 M18 36l19-17" transform="translate(1 0) scale(.94)"/></g>
<text x="518.0" y="784" font-size="24" font-weight="700" fill="#272820">Activation joins exact</text>
<text x="518.0" y="814" font-size="24" font-weight="700" fill="#272820">versions</text>
<text x="518.0" y="858" font-size="22" font-weight="400" fill="#272820">Connection slot → connection</text>
<text x="518.0" y="886" font-size="22" font-weight="400" fill="#272820">revision ID. Connector version ID →</text>
<text x="518.0" y="914" font-size="22" font-weight="400" fill="#272820">admitted release ID. The release</text>
<text x="518.0" y="942" font-size="22" font-weight="400" fill="#272820">still needs current authority.</text>
<rect x="40" y="1068" width="880" height="165" rx="16" fill="#E6E8E6"/>
<g transform="translate(59 1088) scale(0.7)" stroke="#4A5D65" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 28s10-18 25-18 25 18 25 18-10 18-25 18S3 28 3 28z"/><circle cx="28" cy="28" r="8"/></g>
<text x="113" y="1112" font-size="23" font-weight="700" fill="#4A5D65">Check each layer separately</text>
<text x="60" y="1151" font-size="21" font-weight="400" fill="#272820">Package validation checks contracts. Native tests check composition. Neither</text>
<text x="60" y="1180" font-size="21" font-weight="400" fill="#272820">proves a provider account, live access, or successful delivery. Credentials</text>
<text x="60" y="1209" font-size="21" font-weight="400" fill="#272820">stay outside workflow input.</text><g id="takeaway">
<rect x="0" y="1283" width="960" height="90" rx="16" fill="#EAE7DF"/>
<text x="36" y="1312" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#855414">Takeaway</text>
<text x="36" y="1343" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#272820">Installed code still needs published contracts and permission to execute.</text>
</g>
</svg>
