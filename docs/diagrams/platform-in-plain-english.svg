</g></g>
<text x="110" y="1085" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="1116" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">The API coordinates, the database remembers, and integration code calls other systems.</text>
</g>
</svg>
