    <path d="M122 140Q129 143 136 139" fill="none" stroke="#84B295" stroke-width="1.5"/>
  </g>
</g></g>
<text x="110" y="650" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="681" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Match the claim to its evidence: source, local tests, or real provider delivery.</text>
</g>
</svg>
