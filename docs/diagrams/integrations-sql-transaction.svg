<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL: one invocation, one external transaction</title><desc id="desc">Diagram of fixed SQL and parameter bindings entering an external transaction. Idempotent commands atomically retain a ledger record, business effect and result; lost commit acknowledgment remains unknown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173D34;font-size:18px}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.bold{font-weight:700}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke:#91B4A3;stroke-width:2;stroke-dasharray:7 6}</style>
<rect width="1120" height="820" fill="#FAFCFA"/>
<text x="40" y="49" class="title">PostgreSQL: one invocation, one external transaction</text>
<text x="40" y="84" class="">The business database transaction is separate from Weave’s runtime transaction.</text>
<rect x="40" y="125" width="480" height="130" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="60" y="159" class="head">Published Action</text>
<text x="60" y="191" class="">Reviewed statement + parameter schema</text>
<text x="60" y="218" class="">read / command / idempotent-command</text>
<rect x="600" y="125" width="480" height="130" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="620" y="159" class="head">Connection revision + invocation</text>
<text x="620" y="191" class="">Fixed database, IP, TLS policy, secret handle</text>
<text x="620" y="218" class="">Input supplies parameter values, not identifiers.</text>
<path class="edge" d="M280 255V290H560V320"/>
<path class="edge" d="M840 255V290H560"/>
<rect x="150" y="330" width="820" height="290" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="170" y="364" class="head">External PostgreSQL transaction</text>
<text x="170" y="396" class="">Authorize → connect → BEGIN → table metadata checks</text>
<text x="170" y="423" class="">Authorize → bind values → execute reviewed operation</text>
<text x="170" y="450" class="">Validate full bounded output before COMMIT</text>
<rect x="190" y="480" width="740" height="100" rx="12" fill="#FAFCFA" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="210" y="514" class="head">Only for idempotent-command</text>
<text x="210" y="546" class="">Operation key + request fingerprint + business change + saved result</text>
<text x="210" y="573" class="">All commit together; a matching duplicate recovers the saved result.</text>
<rect x="40" y="675" width="490" height="100" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="60" y="709" class="head">Commit acknowledged</text>
<text x="60" y="741" class="">Return validated rows / affected count.</text>
<rect x="590" y="675" width="490" height="100" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="610" y="709" class="head">Commit acknowledgment lost</text>
<text x="610" y="741" class="">SQL_COMMIT_UNKNOWN; reconcile first.</text>
<path class="edge" d="M360 620V647H285V665"/>
<path class="edge" d="M760 620V647H835V665"/>
</svg>
