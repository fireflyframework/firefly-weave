<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1317" viewBox="0 0 960 1317" role="img" aria-labelledby="title desc">
<title id="title">Read evidence before changing execution</title><desc id="desc">Two rows with separate responsibilities. Read only: offline replay feeds the pure kernel the pinned artifact and accepted events, with no Action, network, secret access or resume, and reports consistent for a fully evidenced terminal stream, incomplete to keep the verified prefix, or inconsistent to inspect the first contradiction. Authorized change: first obtain independent delivery evidence from the external system, read the incident's code and current revision, and generate a new receipt ID for your decision; then choose an allowed resolution, retry_safe for a safe effect with the same deadline and operation key, accept_reconciled_result with evidence and valid output, or terminate to cancel execution, and submit it with the incident revision. Replay cannot fill missing evidence and authorization_verified stays false; clear the last blocking incident to continue, and remember that a whole-run retry needs a terminal parent and creates new operation keys with possible new effects.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.edge{stroke:#367D68;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="960" height="1217" rx="24" fill="#FAFCFB"/>
<rect x="32" y="30" width="7" height="58" rx="3" fill="#367D68"/>
<text x="58" y="58" font-size="32" font-weight="700" fill="#173D34">Read evidence before changing execution</text>
<text x="58" y="102" font-size="21" font-weight="400" fill="#173D34">Start with the exact run, pinned artifact, retained history, omissions,</text>
<text x="58" y="131" font-size="21" font-weight="400" fill="#173D34">incident, and task generation.</text>
<rect x="40" y="154" width="880" height="44" rx="12" fill="#EEF4F0"/>
<text x="58" y="182" font-size="19" font-weight="600" fill="#173D34">READ EACH ROW LEFT TO RIGHT  •  Rows show separate responsibilities</text>
<text x="48" y="242" font-size="24" font-weight="700" fill="#173D34">READ ONLY • Ask whether the retained story is internally consistent</text>
<rect x="40.0" y="263" width="420.0" height="309" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<circle cx="86.0" cy="309" r="29" fill="#EEF4F0"/>
<g transform="translate(63.0 286) scale(0.82)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 28s10-18 25-18 25 18 25 18-10 18-25 18S3 28 3 28z"/><circle cx="28" cy="28" r="8"/></g>
<text x="58.0" y="366" font-size="24" font-weight="700" fill="#173D34">Replay recorded transitions</text>
<text x="58.0" y="410" font-size="22" font-weight="400" fill="#173D34">The pure kernel consumes the</text>
<text x="58.0" y="438" font-size="22" font-weight="400" fill="#173D34">artifact and accepted events.</text>
<text x="58.0" y="466" font-size="22" font-weight="400" fill="#173D34">No Action, network, secret access,</text>
<text x="58.0" y="494" font-size="22" font-weight="400" fill="#173D34">or resume happens.</text>
<path class="edge" d="M465.0 417.5h29"/>
<rect x="500.0" y="263" width="420.0" height="309" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<circle cx="546.0" cy="309" r="29" fill="#EEF4F0"/>
<g transform="translate(523.0 286) scale(0.82)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h20l11 11v35H12z M32 5v12h11 M20 27h15 M20 35h15 M20 43h10"/></g>
<text x="518.0" y="366" font-size="24" font-weight="700" fill="#173D34">Read the replay result</text>
<text x="518.0" y="410" font-size="22" font-weight="400" fill="#173D34">consistent: fully evidenced</text>
<text x="518.0" y="438" font-size="22" font-weight="400" fill="#173D34">terminal stream.</text>
<text x="518.0" y="466" font-size="22" font-weight="400" fill="#173D34">incomplete: retain the verified</text>
<text x="518.0" y="494" font-size="22" font-weight="400" fill="#173D34">prefix.</text>
<text x="518.0" y="522" font-size="22" font-weight="400" fill="#173D34">inconsistent: inspect the first</text>
<text x="518.0" y="550" font-size="22" font-weight="400" fill="#173D34">contradiction.</text>
<text x="48" y="630" font-size="24" font-weight="700" fill="#173D34">AUTHORIZED CHANGE • Reconcile the real-world effect first</text>
<rect x="40.0" y="651" width="420.0" height="309" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<circle cx="86.0" cy="697" r="29" fill="#EEF4F0"/>
<g transform="translate(63.0 674) scale(0.82)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 43C-2 43-2 20 13 19 17 1 42 4 44 22 59 25 54 43 42 43z M28 20v30 M20 42l8 8 8-8"/></g>
<text x="58.0" y="754" font-size="24" font-weight="700" fill="#173D34">Inspect the external system</text>
<text x="58.0" y="798" font-size="22" font-weight="400" fill="#173D34">Obtain independent delivery</text>
<text x="58.0" y="826" font-size="22" font-weight="400" fill="#173D34">evidence.</text>
<text x="58.0" y="854" font-size="22" font-weight="400" fill="#173D34">Read the incident’s code and</text>
<text x="58.0" y="882" font-size="22" font-weight="400" fill="#173D34">current revision.</text>
<text x="58.0" y="910" font-size="22" font-weight="400" fill="#173D34">Generate a new receipt ID for</text>
<text x="58.0" y="938" font-size="22" font-weight="400" fill="#173D34">your decision.</text>
<path class="edge" d="M465.0 805.5h29"/>
<rect x="500.0" y="651" width="420.0" height="309" rx="18" fill="white" stroke="#BFD2C8" stroke-width="2"/>
<circle cx="546.0" cy="697" r="29" fill="#EEF4F0"/>
<g transform="translate(523.0 674) scale(0.82)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 18c0-17 24-17 24 0 0 10-13 9-13 20 M29 46v2"/><circle cx="28" cy="28" r="25"/></g>
<text x="518.0" y="754" font-size="24" font-weight="700" fill="#173D34">Choose an allowed resolution</text>
<text x="518.0" y="798" font-size="22" font-weight="400" fill="#173D34">retry_safe: safe effect, same</text>
<text x="518.0" y="826" font-size="22" font-weight="400" fill="#173D34">deadline and operation key.</text>
<text x="518.0" y="854" font-size="22" font-weight="400" fill="#173D34">accept_reconciled_result: evidence</text>
<text x="518.0" y="882" font-size="22" font-weight="400" fill="#173D34">plus valid output.</text>
<text x="518.0" y="910" font-size="22" font-weight="400" fill="#173D34">terminate: cancel execution.</text>
<text x="518.0" y="938" font-size="22" font-weight="400" fill="#173D34">Submit with the incident revision.</text>
<rect x="40" y="1008" width="880" height="165" rx="16" fill="#FFF7E5"/>
<g transform="translate(59 1028) scale(0.7)" stroke="#367D68" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 28s10-18 25-18 25 18 25 18-10 18-25 18S3 28 3 28z"/><circle cx="28" cy="28" r="8"/></g>
<text x="113" y="1052" font-size="23" font-weight="700" fill="#367D68">Replay cannot fill missing evidence</text>
<text x="60" y="1091" font-size="21" font-weight="400" fill="#173D34">authorization_verified remains false. Clear the last blocking incident to</text>
<text x="60" y="1120" font-size="21" font-weight="400" fill="#173D34">continue. Whole-run retry needs a terminal parent and creates new operation</text>
<text x="60" y="1149" font-size="21" font-weight="400" fill="#173D34">keys with possible new effects.</text><g id="lumi-takeaway">
<rect x="0" y="1223" width="960" height="90" rx="16" fill="#EAF4ED"/>
<g transform="translate(22 1234) scale(.25)"><defs>
  <radialGradient id="lumi-face" cx=".3" cy=".2" r=".9">
    <stop stop-color="#3C6957"/><stop offset=".55" stop-color="#1C463A"/>
    <stop offset="1" stop-color="#102E28"/>
  </radialGradient>
  <linearGradient id="lumi-eye" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8DCC8"/>
  </linearGradient>
  <linearGradient id="lumi-lantern" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFEDAD"/><stop offset="1" stop-color="#DDA743"/></linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <path d="M113 89C109 67 100 51 89 45M143 89C147 67 156 51 167 45" fill="none" stroke="#315C4E" stroke-width="3.5"/>
  <path d="M102 134Q128 122 154 134L153 184C153 206 142 219 128 219C114 219 103 206 103 184Z" fill="#173D34"/>
