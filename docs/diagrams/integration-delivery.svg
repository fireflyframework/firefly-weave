<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="title desc">
<title id="title">Events come in; delivery attempts go out</title><desc id="desc">Two lanes. Incoming event to workflow admission, left to right: verify the source with the provider or broker protocol and current source authority; keep a durable receipt and intent, where an identical repeat is recognized and a changed event with the same ID is refused as a conflict; then admit the work by starting a run from an activation or signaling one exact run. Committed business event to external delivery: commit the integration event with the business transition, where a subscription selects delivery intent; admit each delivery attempt with current bindings and grants, where a generation fences results; then record the outcome, such as provider acceptance, and reconcile unknown results. Provider-specific records (Teams reference lifecycle, WhatsApp status facts, Telegram update receipts) are evidence, not delivery guarantees; delivery remains at least once, and broker offsets do not create a global effects transaction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173D34}.title{font-size:31px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.code{font-family:Menlo,Consolas,monospace;font-size:17px}.muted{fill:#566c61}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.white{fill:white}</style>
<rect width="960" height="780" rx="16" fill="#f7faf8"/>
<path d="M36 99H924" stroke="#c9dacf"/>
<text x="36" y="46" class="title">Events come in; delivery attempts go out</text>
<text x="36" y="79" class="body muted">Admission, workflow progress, and provider acknowledgment are separate facts.</text>
<rect x="36" y="126" width="888" height="220" rx="12" fill="#eaf4ed"/>
<text x="58" y="162" class="head">Incoming event → workflow admission</text>
<g transform="translate(58,185) scale(1.3076923076923077)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 2L23 12L1 22L5 12Z M5 12H23"/></g>
<text x="58" y="247" class="head">Verify the source</text>
<text x="58" y="282" class="small">Provider or broker protocol</text>
<text x="58" y="309" class="small">Current source authority</text>
<g transform="translate(378,185) scale(1.3076923076923077)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="378" y="247" class="head">Keep the receipt</text>
<text x="378" y="282" class="small">Duplicates recognized or refused</text>
<text x="378" y="309" class="small">Durable receipt + intent</text>
<g transform="translate(692,185) scale(1.3076923076923077)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1L23 12L5 23Z"/></g>
<text x="692" y="247" class="head">Admit the work</text>
<text x="692" y="282" class="small">Start a new run,</text>
<text x="692" y="309" class="small">or signal one exact run</text>
<path class="edge" d="M296 202H355"/>
<path class="edge" d="M617 202H673"/>
<rect x="36" y="377" width="888" height="220" rx="12" fill="white" stroke="#a8bdb1"/>
<text x="58" y="414" class="head">Committed business event → external delivery</text>
<g transform="translate(58,437) scale(1.3076923076923077)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="58" y="499" class="head">Commit the event</text>
<text x="58" y="534" class="small">With the business transition</text>
<text x="58" y="561" class="small">Subscription selects intent</text>
<g transform="translate(378,437) scale(1.3076923076923077)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6A6 6 0 0 1 12 0A6 6 0 0 1 18 6V10 M3 10H21V24H3Z M12 15V19"/></g>
<text x="378" y="499" class="head">Admit the attempt</text>
<text x="378" y="534" class="small">Current bindings + grants</text>
<text x="378" y="561" class="small">Generation fences results</text>
<g transform="translate(692,437) scale(1.3076923076923077)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20A5 5 0 0 1 3 10A8 8 0 0 1 19 8A6 6 0 0 1 20 20Z"/></g>
<text x="692" y="499" class="head">Record the outcome</text>
<text x="692" y="534" class="small">Provider acceptance</text>
<text x="692" y="561" class="small">Reconcile unknown results</text>
<path class="edge" d="M296 454H355"/>
<path class="edge" d="M617 454H673"/>
<rect x="36" y="627" width="888" height="108" rx="12" fill="#FFF7E5"/>
<g transform="translate(54,647) scale(1.1538461538461537)" fill="none" stroke="#94601b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0 12Q12 -4 24 12Q12 28 0 12Z M16 12A4 4 0 1 1 8 12A4 4 0 1 1 16 12"/></g>
<text x="98" y="661" class="head">Provider-specific records are evidence, not delivery guarantees.</text>
<text x="98" y="692" class="small">Teams retains reference lifecycle; WhatsApp retains status facts; Telegram retains update receipts.</text>
<text x="98" y="719" class="small">At-least-once delivery remains. Broker offsets do not create a global effects transaction.</text>
<g id="takeaway">
<rect x="0" y="786" width="960" height="90" rx="16" fill="#EAF4ED"/>
<text x="36" y="815" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Takeaway</text>
<text x="36" y="846" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">An admission receipt and a provider acknowledgment prove different things.</text>
</g>
</svg>
