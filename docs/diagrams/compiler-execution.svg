<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" aria-labelledby="title desc">
<title id="title">From a written workflow to durable work</title><desc id="desc">Checking a definition and running it are different operations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2d7257"/></marker></defs>
<style>text{font-family:"Avenir Next",Arial,Helvetica,sans-serif;fill:#163e31}.title{font-size:31px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.code{font-family:Menlo,Consolas,monospace;font-size:17px}.muted{fill:#566c61}.edge{fill:none;stroke:#2d7257;stroke-width:2.5;marker-end:url(#arrow)}.white{fill:white}</style>
<rect width="960" height="820" rx="16" fill="#f7faf8"/>
<path d="M36 99H924" stroke="#c9dacf"/>
<text x="36" y="46" class="title">From a written workflow to durable work</text>
<text x="36" y="79" class="body muted">Checking a definition and running it are different operations.</text>
<rect x="36" y="121" width="888" height="252" rx="12" fill="#eaf4ed"/>
<g transform="translate(55,140) scale(1.1923076923076923)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1H15L21 7V23H5Z M15 1V7H21 M9 12H17 M9 17H17"/></g>
<text x="103" y="163" class="head">First, compile without services or secrets</text>
<g transform="translate(56,195) scale(1.2307692307692308)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L9 18L21 5"/></g>
<text x="56" y="254" class="head">Read + validate</text>
<text x="56" y="289" class="small">Bound YAML / JSON</text>
<text x="56" y="315" class="small">Check schemas</text>
<g transform="translate(280,195) scale(1.2307692307692308)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8L13 5A5 5 0 0 1 20 12L17 15 M14 16L11 19A5 5 0 0 1 4 12L7 9 M8 16L16 8"/></g>
<text x="280" y="254" class="head">Resolve meaning</text>
<text x="280" y="289" class="small">Use the catalog lock</text>
<text x="280" y="315" class="small">Check types + links</text>
<g transform="translate(503,195) scale(1.2307692307692308)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6L0 12L5 18 M19 6L24 12L19 18 M14 3L10 21"/></g>
<text x="503" y="254" class="head">Build the graph</text>
<text x="503" y="289" class="small">Lower to canonical IR</text>
<text x="503" y="315" class="small">Pin dependencies</text>
<g transform="translate(730,195) scale(1.2307692307692308)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6L12 0L23 6L12 12Z M1 6V20L12 26L23 20V6 M12 12V26"/></g>
<text x="730" y="254" class="head">Emit an artifact</text>
<text x="730" y="289" class="small">Digest + source map</text>
<text x="730" y="315" class="small">Versioned envelope</text>
<path class="edge" d="M225 211H262"/>
<path class="edge" d="M448 211H485"/>
<path class="edge" d="M675 211H712"/>
<text x="56" y="351" class="small muted">No catalog → partial validation only; no executable artifact.</text>
<rect x="36" y="405" width="888" height="252" rx="12" fill="white" stroke="#a8bdb1"/>
<g transform="translate(56,424) scale(1.1923076923076923)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6A6 6 0 0 1 12 0A6 6 0 0 1 18 6V10 M3 10H21V24H3Z M12 15V19"/></g>
<text x="103" y="448" class="head">Then, use authorized server operations</text>
<circle cx="75" cy="489" r="19" fill="#2d7257"/>
<text x="75" y="496" class="body white" text-anchor="middle">1</text>
<text x="56" y="541" class="head">Publish</text>
<text x="56" y="574" class="small">Recompile source</text>
<text x="56" y="600" class="small">Store immutable version</text>
<circle cx="299" cy="489" r="19" fill="#2d7257"/>
<text x="299" y="496" class="body white" text-anchor="middle">2</text>
<text x="280" y="541" class="head">Activate</text>
<text x="280" y="574" class="small">Pin version + bindings</text>
<text x="280" y="600" class="small">Check current authority</text>
<circle cx="522" cy="489" r="19" fill="#2d7257"/>
<text x="522" y="496" class="body white" text-anchor="middle">3</text>
<text x="503" y="541" class="head">Start a run</text>
<text x="503" y="574" class="small">Evaluate pinned graph</text>
<text x="503" y="600" class="small">Persist tasks and waits</text>
<circle cx="749" cy="489" r="19" fill="#2d7257"/>
<text x="749" y="496" class="body white" text-anchor="middle">4</text>
<text x="730" y="541" class="head">Execute tasks</text>
<text x="730" y="574" class="small">Native or remote worker</text>
<text x="730" y="600" class="small">Fenced lease + receipt</text>
<path class="edge" d="M225 489H262"/>
<path class="edge" d="M448 489H485"/>
<path class="edge" d="M675 489H712"/>
<text x="56" y="635" class="small muted">PostgreSQL commits state, task receipts, deadlines and recovery decisions.</text>
<rect x="36" y="684" width="888" height="81" rx="12" fill="#fff3df"/>
<g transform="translate(54,704) scale(1.1538461538461537)" fill="none" stroke="#94601b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0 12Q12 -4 24 12Q12 28 0 12Z M16 12A4 4 0 1 1 8 12A4 4 0 1 1 16 12"/></g>
<text x="98" y="718" class="head">An external call can happen before completion is recorded.</text>
<text x="98" y="749" class="small">Use provider idempotency or reconciliation. Simulation and recorded replay do not call providers.</text>
<g id="lumi-takeaway">
<rect x="0" y="826" width="960" height="90" rx="16" fill="#EAF4ED"/>
<g transform="translate(22 837) scale(.25)"><defs>
  <radialGradient id="lumi-face" cx=".3" cy=".2" r=".9">
    <stop stop-color="#3C6957"/><stop offset=".55" stop-color="#1C463A"/>
    <stop offset="1" stop-color="#102E28"/>
  </radialGradient>
  <linearGradient id="lumi-eye" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8DCC8"/>
  </linearGradient>
  <linearGradient id="lumi-lantern" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFEDAD"/><stop offset="1" stop-color="#DDA743"/></linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <path d="M113 89C109 67 100 51 89 45M143 89C147 67 156 51 167 45" fill="none" stroke="#315C4E" stroke-width="3.5"/>
  <path d="M102 134Q128 122 154 134L153 184C153 206 142 219 128 219C114 219 103 206 103 184Z" fill="#173D34"/>
  <path d="M107 177Q128 185 149 177L148 191C146 205 138 213 128 213C118 213 110 205 108 191Z" fill="url(#lumi-lantern)"/>
  <path d="M30 83L56 61Q61 57 66 64L142 174L130 193L28 91Q24 86 30 83Z" fill="#173D34"/>
  <path d="M57 63L135 175L129 185L30 87Z" fill="#78B89C"/>
  <path d="M57 63L96 119L72 111L30 87Z" fill="#C7E6D7"/>
  <path d="M72 111L96 119L135 175L129 185Z" fill="#4F9479"/>
  <path d="M226 83L200 61Q195 57 190 64L111 178L127 194L228 91Q232 86 226 83Z" fill="#173D34"/>
  <path d="M199 63L116 178L127 187L226 87Z" fill="#A1D1B9"/>
  <path d="M199 63L160 119L184 111L226 87Z" fill="#D8EEE3"/>
  <path d="M184 111L160 119L116 178L127 187Z" fill="#68AA8D"/>
  <g transform="rotate(-5 128 120)">
    <path d="M94 115C93 95 108 81 128 81C148 81 163 95 162 115
      C162 135 150 152 130 158C109 155 95 138 94 115Z" fill="url(#lumi-face)"/>
    <path d="M98 111C98 96 110 86 124 85" fill="none" stroke="#83AF94"
      stroke-width="1.2" opacity=".5"/>
    <path d="M128 87C124 99 124 106 126 112" fill="none" stroke="#58856B"
      stroke-width="1" opacity=".4"/>
    <path d="M103 114C104 106 111 103 117 107C124 111 124 120 119 126
      C111 131 104 124 103 114Z" fill="#0C2923"/>
    <path d="M105 114C106 109 111 107 116 110C120 113 121 120 117 124
      C111 127 106 122 105 114Z" fill="url(#lumi-eye)"/>
    <ellipse cx="114.5" cy="116.5" rx="3.3" ry="5.4" fill="#173D34"/>
    <circle cx="115.5" cy="113.5" r="1.4" fill="#FFFFFF"/>
    <path d="M135 112C138 105 145 103 151 108C156 114 153 124 147 127
      C139 129 133 120 135 112Z" fill="#0C2923"/>
    <path d="M137 113C139 108 144 107 148 110C152 114 150 121 146 124
      C140 126 136 120 137 113Z" fill="url(#lumi-eye)"/>
    <ellipse cx="145" cy="116" rx="3.3" ry="5.4" fill="#173D34"/>
    <circle cx="146" cy="113" r="1.4" fill="#FFFFFF"/>
    <path d="M106 101Q112 98 118 102M137 101Q143 98 149 102"
      fill="none" stroke="#6C997E" stroke-width="1.8" opacity=".65"/>
    <path d="M122 140Q129 143 136 139" fill="none" stroke="#84B295" stroke-width="1.5"/>
  </g>
</g></g>
<text x="110" y="855" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="886" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Compilation checks meaning; activation checks authority and readiness.</text>
</g>
</svg>
