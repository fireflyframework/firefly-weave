<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="795" viewBox="0 0 1120 795" role="img" aria-labelledby="title desc">
<title id="title">HTTP profile v2: fixed policy, bounded invocation</title><desc id="desc">Connection, Action configuration and input converge at a bounded HTTP execution gate. Output contains status and validated body only; ambiguous writes require incident reconciliation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173D34;font-size:18px}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.bold{font-weight:700}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke:#91B4A3;stroke-width:2;stroke-dasharray:7 6}</style>
<rect width="1120" height="795" fill="#FAFCFA"/>
<text x="40" y="49" class="title">HTTP profile v2: fixed policy, bounded invocation</text>
<text x="40" y="84" class="">The invocation fills declared values inside an immutable HTTP operation.</text>
<rect x="40" y="125" width="320" height="200" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="60" y="159" class="head">Connection revision</text>
<text x="60" y="191" class="">HTTPS origin + auth kind</text>
<text x="60" y="218" class="">Exact secret-handle slots</text>
<text x="60" y="245" class="">Allowed destinations</text>
<text x="60" y="272" class="">Operator network policy</text>
<rect x="400" y="125" width="320" height="200" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="420" y="159" class="head">Published Action</text>
<text x="420" y="191" class="">Method + relative path template</text>
<text x="420" y="218" class="">Declared parameters + effect</text>
<text x="420" y="245" class="">Success and empty statuses</text>
<text x="420" y="272" class="">Input / output schemas + bounds</text>
<rect x="760" y="125" width="320" height="200" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="780" y="159" class="head">Invocation input</text>
<text x="780" y="191" class="">Declared path / query / headers</text>
<text x="780" y="218" class="">Optional declared JSON body</text>
<text x="780" y="245" class="">No origin or auth override</text>
<text x="780" y="272" class="">No status-policy override</text>
<path class="edge" d="M200 325V367H390V410"/>
<path class="edge" d="M560 325V410"/>
<path class="edge" d="M920 325V367H730V410"/>
<rect x="240" y="420" width="640" height="180" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="260" y="454" class="head">Bounded native execution</text>
<text x="260" y="486" class="">Validate → current authority → scoped credentials</text>
<text x="260" y="513" class="">Recheck authority → DNS / peer / TLS checks → one request</text>
<text x="260" y="540" class="">Deadline covers acquisition, I/O and response processing.</text>
<text x="260" y="567" class="">No redirects or hidden retries in v2.</text>
<rect x="40" y="655" width="490" height="105" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="60" y="689" class="head">Validated success</text>
<text x="60" y="721" class="">Only status + JSON body, or declared empty null</text>
<rect x="590" y="655" width="490" height="105" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="610" y="689" class="head">Uncertain write acknowledgment</text>
<text x="610" y="721" class="">Unknown outcome → inspect incident and reconcile</text>
<path class="edge" d="M390 600V625H285V645"/>
<path class="edge" d="M730 600V625H835V645"/>
</svg>
