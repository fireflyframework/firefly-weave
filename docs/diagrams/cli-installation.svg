<text x="40" y="267" class="small">Wheel + checksums</text>
<text x="40" y="298" class="small">Locked dependencies</text>
<text x="40" y="329" class="small">GitHub or prepared build</text>
<circle cx="373" cy="146" r="19" fill="#2d7257"/>
<text x="373" y="153" class="body white" text-anchor="middle">2</text>
<g transform="translate(432,127) scale(1.6538461538461537)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L9 18L21 5"/></g>
<text x="353" y="225" class="head">Install and check</text>
<text x="353" y="267" class="small">Isolated Python environment</text>
<text x="353" y="298" class="small">Dependency validation</text>
<text x="353" y="329" class="small">CLI version smoke test</text>
<circle cx="686" cy="146" r="19" fill="#2d7257"/>
<text x="686" y="153" class="body white" text-anchor="middle">3</text>
<g transform="translate(745,127) scale(1.6538461538461537)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 2H25V22H1Z M5 7L10 12L5 17 M13 17H20"/></g>
<text x="666" y="225" class="head">Activate the CLI</text>
<text x="666" y="267" class="small">Select the managed command</text>
<text x="666" y="298" class="small">Add its bin directory to PATH</text>
<text x="666" y="329" class="small">Run weave --help</text>
<path class="edge" d="M296 146H326"/>
<path class="edge" d="M607 146H640"/>
