<text x="60" y="455" class="body">Parent key: E, id</text>
<rect x="610" y="390" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="630" y="424" class="head">task_leases</text>
<text x="630" y="455" class="body">Child FK: E, task_id</text>
<path class="edge" d="M513 439L606 439"/>
<text x="531" y="418" class="small">0..*</text>
