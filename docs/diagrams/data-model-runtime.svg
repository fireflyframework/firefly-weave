<text x="92" y="729" class="code">task_leases</text>
<text x="56" y="768" class="code">Key: E, task_id, generation</text>
<g transform="translate(567,715) scale(0.9615384615384616)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="608" y="729" class="code">completion_receipts</text>
<text x="572" y="768" class="code">FK: E, task_id, generation</text>
<path class="edge" d="M408 743H552"/>
<text x="480" y="725" class="head" text-anchor="middle">0..1</text>
<text x="480" y="776" class="small muted" text-anchor="middle">receipt</text>
<text x="36" y="843" class="small muted">Migrations 0006–0007. Generations distinguish attempts and fence stale completions.</text>
<text x="36" y="869" class="small muted">Runs also own events, step instances, deadlines, and signal receipts; wait wakeups reference deadlines.</text>
<text x="36" y="895" class="small muted">History, incidents, schedules, and debug state have additional scoped ownership.</text>
<g id="takeaway">
<rect x="0" y="971" width="960" height="90" rx="16" fill="#EAF4ED"/>
<text x="36" y="1000" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Takeaway</text>
<text x="36" y="1031" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">The lease generation connects a completion to its current attempt.</text>
</g>
