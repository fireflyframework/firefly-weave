<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1065" viewBox="0 0 960 1065" role="img" aria-labelledby="title desc">
<title id="title">How runs own work and completion evidence</title><desc id="desc">Selected foreign keys for durable execution and lease fencing, read left to right as one parent to its children. P means tenant_id plus project_id; E means P plus environment_id. An activation revision has many runs; a run has many task_intents; a task intent has many task_leases (attempts); a worker instance owns many task_leases; each task lease (task_id, generation) has at most one completion receipt. Grounded in migrations 0006 and 0007; generations distinguish attempts and fence stale completions. Runs also own events, step instances, deadlines, and signal receipts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173D34}.title{font-size:31px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.code{font-family:Menlo,Consolas,monospace;font-size:17px}.muted{fill:#566c61}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.white{fill:white}</style>
<rect width="960" height="965" rx="16" fill="#f7faf8"/>
<path d="M36 99H924" stroke="#c9dacf"/>
<text x="36" y="46" class="title">How runs own work and completion evidence</text>
<text x="36" y="79" class="body muted">Selected actual foreign keys for durable execution and lease fencing.</text>
<text x="36" y="132" class="small muted">P = tenant_id + project_id  •  E = P + environment_id</text>
<text x="36" y="162" class="small muted">Read left to right: one parent → this many children. Each child has one shown parent.</text>
<rect x="36" y="188" width="372" height="102" rx="12" fill="white" stroke="#a8bdb1"/>
