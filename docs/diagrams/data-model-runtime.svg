<text x="531" y="538" class="small">0..*</text>
<rect x="40" y="630" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="60" y="664" class="head">task_leases</text>
<text x="60" y="695" class="body">Parent key: E, task_id, generation</text>
<rect x="610" y="630" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="630" y="664" class="head">completion_receipts</text>
<text x="630" y="695" class="body">Child FK: E, task_id, generation</text>
<path class="edge" d="M513 679L606 679"/>
<text x="531" y="658" class="small">0..1</text>
<text x="40" y="764" class="small">Sources: migrations 0006, 0007. Lease generations distinguish retries and fence late completions.</text>
<text x="40" y="792" class="small">Runs also own events, step instances, deadlines and signal receipts; event evidence extends run events.</text>
<text x="40" y="820" class="small">Wait wakeups reference deadlines. Incidents, schedules and debug state have additional scoped ownership.</text>

