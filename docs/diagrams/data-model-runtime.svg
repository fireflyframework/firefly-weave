<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 869" role="img" aria-labelledby="title desc">
<title id="title">Runtime, leases and completion evidence</title><desc id="desc">A selected relational model with scoped composite keys and parent-to-child cardinalities. See the architecture guide for migration sources and omitted logical references.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173D34}.title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1120" height="869" fill="#FFFFFF"/>
<text x="40" y="50" class="title">Runtime, leases and completion evidence</text>
<text x="40" y="85" class="body">Selected actual foreign keys. Arrows point from parent to child; every child has one shown parent.</text>
<text x="40" y="114" class="small">P = tenant_id + project_id. E = P + environment_id. ID columns are shown explicitly.</text>
<rect x="40" y="150" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="60" y="184" class="head">activation_revisions</text>
