<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="title desc">
<title id="title">Who may do what, and where?</title><desc id="desc">Three questions in order. 1, who is calling: verify the configured issuer, audience, client and token type, and resolve provider, issuer and subject to a linked local principal. 2, may this person or service do this here: check local grants for tenant, project, environment and resource; application services enforce the same checks as HTTP requests. 3, which data may the transaction touch: set transaction-local tenant context in the unit of work, and PostgreSQL row-level security and scoped composite keys bound the data. Secrets need their own admission check: scoped secret handles resolve only for authorized work and approved destinations, and migration owner, application, scheduler and worker identities stay separate. Provider role claims, URL IDs and compiler success never grant permission.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173D34}.title{font-size:31px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.code{font-family:Menlo,Consolas,monospace;font-size:17px}.muted{fill:#566c61}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.white{fill:white}</style>
<rect width="960" height="760" rx="16" fill="#f7faf8"/>
<path d="M36 99H924" stroke="#c9dacf"/>
<text x="36" y="46" class="title">Who may do what, and where?</text>
<text x="36" y="79" class="body muted">A valid identity is the start of authorization, not its conclusion.</text>
<circle cx="58" cy="151" r="19" fill="#367D68"/>
<text x="58" y="158" class="body white" text-anchor="middle">1</text>
<g transform="translate(108,132) scale(1.5384615384615385)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6A6 6 0 1 1 6 6A6 6 0 1 1 18 6 M1 24V22A11 10 0 0 1 23 22V24"/></g>
<text x="168" y="161" class="head">Who is calling?</text>
<text x="110" y="207" class="body">Verify the configured issuer, audience, client and token type.</text>
<text x="110" y="237" class="body">Resolve the provider / issuer / subject to a local principal.</text>
<path class="edge" d="M58 178V243"/>
<circle cx="58" cy="294" r="19" fill="#367D68"/>
<text x="58" y="301" class="body white" text-anchor="middle">2</text>
<g transform="translate(108,275) scale(1.5384615384615385)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6A6 6 0 0 1 12 0A6 6 0 0 1 18 6V10 M3 10H21V24H3Z M12 15V19"/></g>
<text x="168" y="304" class="head">May this person or service do this here?</text>
<text x="110" y="350" class="body">Check local grants for tenant, project, environment and resource.</text>
<text x="110" y="380" class="body">Application services enforce the same checks as HTTP requests.</text>
<path class="edge" d="M58 321V386"/>
<circle cx="58" cy="437" r="19" fill="#367D68"/>
<text x="58" y="444" class="body white" text-anchor="middle">3</text>
<g transform="translate(108,418) scale(1.5384615384615385)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="168" y="447" class="head">Which data may the transaction touch?</text>
<text x="110" y="493" class="body">Set transaction-local tenant context in the unit of work.</text>
<text x="110" y="523" class="body">PostgreSQL RLS and scoped composite keys bound the data.</text>
<rect x="36" y="563" width="888" height="108" rx="12" fill="#eaf4ed"/>
<g transform="translate(54,583) scale(1.1538461538461537)" fill="none" stroke="#367D68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L9 18L21 5"/></g>
<text x="98" y="597" class="head">Secrets need their own admission check.</text>
<text x="98" y="628" class="small">Resolve scoped secret handles only for authorized work and approved destinations.</text>
<text x="98" y="655" class="small">Migration owner, application, scheduler and worker identities remain separate.</text>
<text x="36" y="716" class="small muted">Provider role claims, URL IDs and compiler success do not grant permission.</text>
<g id="lumi-takeaway">
