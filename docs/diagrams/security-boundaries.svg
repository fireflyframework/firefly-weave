</g></g>
<text x="110" y="795" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="826" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Identity says who called; current scoped grants decide what they may do.</text>
