<text x="110" y="834" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="865" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">New inputs create new runs; source edits do not rewrite existing runs.</text>
</g>
</svg>
