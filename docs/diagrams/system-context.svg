<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title desc">
<title id="title">How your product connects to Weave</title><desc id="desc">One API coordinates work; PostgreSQL remembers what happened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2d7257"/></marker></defs>
<style>text{font-family:"Avenir Next",Arial,Helvetica,sans-serif;fill:#163e31}.title{font-size:31px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.code{font-family:Menlo,Consolas,monospace;font-size:17px}.muted{fill:#566c61}.edge{fill:none;stroke:#2d7257;stroke-width:2.5;marker-end:url(#arrow)}.white{fill:white}</style>
<rect width="960" height="840" rx="16" fill="#f7faf8"/>
<path d="M36 99H924" stroke="#c9dacf"/>
<text x="36" y="46" class="title">How your product connects to Weave</text>
<text x="36" y="79" class="body muted">One API coordinates work; PostgreSQL remembers what happened.</text>
<g transform="translate(42,127) scale(1.4615384615384615)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6L0 12L5 18 M19 6L24 12L19 18 M14 3L10 21"/></g>
<text x="42" y="189" class="head">Your product</text>
<text x="42" y="221" class="small">SDK, CLI or HTTP requests</text>
<text x="42" y="247" class="small">Choose an identity and scope</text>
<g transform="translate(365,127) scale(1.4615384615384615)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1H15L21 7V23H5Z M15 1V7H21 M9 12H17 M9 17H17"/></g>
<text x="365" y="189" class="head">Check a workflow</text>
<text x="365" y="221" class="small">Offline compiler</text>
<text x="365" y="247" class="small">No database or network</text>
<g transform="translate(682,127) scale(1.4615384615384615)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6A6 6 0 1 1 6 6A6 6 0 1 1 18 6 M1 24V22A11 10 0 0 1 23 22V24"/></g>
<text x="682" y="189" class="head">Identity provider</text>
<text x="682" y="221" class="small">Verify the access token</text>
<text x="682" y="247" class="small">Link it to a local principal</text>
<path class="edge" d="M160 263V314"/>
<text x="174" y="293" class="small muted">API requests</text>
<path class="edge" d="M465 263V314"/>
<text x="478" y="293" class="small muted">checked definition</text>
<path class="edge" d="M810 263V292H608V314"/>
<rect x="36" y="321" width="582" height="316" rx="12" fill="#eaf4ed" stroke="#a8bdb1"/>
<g transform="translate(56,344) scale(1.3846153846153846)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V6A6 6 0 0 1 12 0A6 6 0 0 1 18 6V10 M3 10H21V24H3Z M12 15V19"/></g>
<text x="110" y="373" class="head">Weave API + application services</text>
<text x="62" y="415" class="body">Check grants inside every service</text>
<text x="62" y="452" class="body">Manage versions, activations and connections</text>
<text x="62" y="489" class="body">Advance runs, waits and signals</text>
<text x="62" y="526" class="body">Keep worker receipts and redacted history</text>
<text x="62" y="605" class="small muted">Native PyFly application · modular monolith</text>
<g transform="translate(695,329) scale(1.5384615384615385)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6H19V20H5Z M9 1V6 M15 1V6 M9 20V25 M15 20V25 M0 10H5 M0 16H5 M19 10H24 M19 16H24 M9 10H15V16H9Z"/></g>
<text x="686" y="395" class="head">Remote workers</text>
<text x="686" y="430" class="small">Another process</text>
<text x="686" y="459" class="small">Claim → heartbeat → complete</text>
<path class="edge" d="M618 455H674" marker-start="url(#arrow)"/>
<g transform="translate(695,532) scale(1.6153846153846154)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20A5 5 0 0 1 3 10A8 8 0 0 1 19 8A6 6 0 0 1 20 20Z"/></g>
<text x="686" y="595" class="head">External systems</text>
<text x="686" y="627" class="small">Only admitted destinations</text>
<text x="686" y="656" class="small">Only granted credentials</text>
<path class="edge" d="M810 474V526"/>
<path class="edge" d="M618 577H675"/>
<text x="62" y="565" class="small muted">Native dispatch uses the same worker protocol.</text>
<path class="edge" d="M310 637V689"/>
<text x="331" y="672" class="small muted">scoped transactions</text>
<rect x="36" y="702" width="582" height="96" rx="12" fill="white" stroke="#a8bdb1"/>
<g transform="translate(58,727) scale(1.6153846153846154)" fill="none" stroke="#2d7257" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5C2 -1 22 -1 22 5C22 11 2 11 2 5 M2 5V20C2 26 22 26 22 20V5 M2 13C2 19 22 19 22 13"/></g>
<text x="119" y="740" class="head">PostgreSQL stores durable state</text>
<text x="119" y="775" class="small">Tenant RLS · explicit migrations · separate roles</text>
<text x="686" y="729" class="small muted">A connector also needs an</text>
<text x="686" y="757" class="small muted">installed, admitted release.</text>
<text x="686" y="785" class="small muted">A diagram is not live proof.</text>
