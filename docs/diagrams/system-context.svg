<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title desc">
<title id="title">How your product connects to Weave</title><desc id="desc">Three sources feed the Weave API. Your product or tool (Studio, the CLI, the SDK, or any HTTP client) sends API requests after signing in and choosing a workspace. The offline compiler checks a workflow without a database or network and hands over a checked definition. The identity provider issues tokens at sign-in, and the API verifies them. Inside the API, application services check grants in every service, manage versions, activations and connections, advance runs, waits and signals, and keep worker receipts and redacted history; native dispatch uses the same worker protocol. The API exchanges claims, heartbeats and completions with remote workers in another process, and reaches external systems only at admitted destinations with granted credentials. It stores durable state in PostgreSQL through scoped transactions, with tenant row-level security, explicit migrations and separate roles. Connectors run in a native executor; your own handlers run in remote workers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62645B"/></marker></defs>
