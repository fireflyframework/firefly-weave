<text x="110" y="875" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="906" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Keep workflow checks, durable coordination and external effects distinct.</text>
