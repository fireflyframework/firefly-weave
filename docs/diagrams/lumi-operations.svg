<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title description">
  <title id="title">Ask Lumi about a deployment</title>
  <desc id="description">Select an Operations record, choose which facts to attach, and send a question. Weave checks access and shares a limited summary with the configured assistant. Review the explanation against current evidence. Deployment changes still require a separate plan, approval, and application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#397963" stroke-width="1.7"/></marker>
    <style>
      text {font-family:Inter,Arial,sans-serif;fill:#173D34}
      .title {font-size:35px;font-weight:700}
      .heading {font-size:23px;font-weight:700}
      .body {font-size:20px}
      .small {font-size:18px;fill:#48655C}
      .card {fill:#fff;stroke:#C4D8CE;stroke-width:2}
      .link {fill:none;stroke:#397963;stroke-width:2;marker-end:url(#arrow)}
      .icon {fill:none;stroke:#397963;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="830" rx="24" fill="#F3F8F5"/>
  <text x="40" y="59" class="title">Ask Lumi about a deployment</text>
  <text x="40" y="96" class="body">Get help understanding what you see in Operations, with context you choose.</text>
  <g transform="translate(40 139)">
    <rect class="card" width="260" height="264" rx="18"/>
    <rect x="18" y="18" width="48" height="48" rx="12" fill="#E6F2EB"/>
    <g class="icon" transform="translate(28 28)"><rect width="28" height="19" rx="3"/><path d="M8 25h12M14 19v6M6 7h16M6 12h10"/></g>
    <text x="18" y="103" class="heading">1. Select a record</text>
    <text x="18" y="141" class="body"><tspan x="18">Open a target,</tspan><tspan x="18" dy="29">deployment, plan,</tspan><tspan x="18" dy="29">or operation job.</tspan></text>
    <text x="18" y="239" class="small">Choose Explain with Lumi.</text>
  </g>
  <path class="link" d="M304 263h19"/>
  <g transform="translate(325 139)">
    <rect class="card" width="260" height="264" rx="18"/>
    <rect x="18" y="18" width="48" height="48" rx="12" fill="#E6F2EB"/>
    <g class="icon" transform="translate(29 28)"><path d="M7 0h16v28H0V7zM0 7h7V0M6 14l4 4 8-8M6 23h11"/></g>
    <text x="18" y="103" class="heading">2. Choose context</text>
    <text x="18" y="141" class="body"><tspan x="18">Select the records</tspan><tspan x="18" dy="29">you want to share.</tspan><tspan x="18" dy="29">Type your question.</tspan></text>
    <text x="18" y="239" class="small">Nothing is sent on opening.</text>
  </g>
  <path class="link" d="M589 263h19"/>
  <g transform="translate(610 139)">
    <rect class="card" width="260" height="264" rx="18"/>
    <rect x="18" y="18" width="48" height="48" rx="12" fill="#E6F2EB"/>
    <g class="icon" transform="translate(28 26)"><path d="M14 0l13 5v10c0 9-13 16-13 16S1 24 1 15V5zM7 14l5 5 9-10"/></g>
    <text x="18" y="103" class="heading">3. Weave checks</text>
    <text x="18" y="141" class="body"><tspan x="18">Your access is checked.</tspan><tspan x="18" dy="29">Lumi receives a limited</tspan><tspan x="18" dy="29">summary of the records.</tspan></text>
    <text x="18" y="239" class="small">Credentials stay private.</text>
  </g>
  <path class="link" d="M874 263h19"/>
  <g transform="translate(895 139)">
    <rect class="card" width="265" height="264" rx="18"/>
    <rect x="18" y="18" width="48" height="48" rx="12" fill="#E6F2EB"/>
    <g class="icon" transform="translate(28 27)"><path d="M3 0h23a3 3 0 013 3v17a3 3 0 01-3 3H12l-8 7v-7H3a3 3 0 01-3-3V3a3 3 0 013-3zM7 8h15M7 15h10"/></g>
    <text x="18" y="103" class="heading">4. Review the reply</text>
    <text x="18" y="141" class="body"><tspan x="18">Understand the status,</tspan><tspan x="18" dy="29">capacity settings,</tspan><tspan x="18" dy="29">and possible next checks.</tspan></text>
    <text x="18" y="239" class="small">Compare with live evidence.</text>
  </g>
  <rect x="40" y="433" width="1120" height="140" rx="18" fill="#FFF6E3" stroke="#E4D3AE"/>
  <text x="64" y="473" class="heading">Keep the evidence in view</text>
  <text x="64" y="509" class="body">An observation describes a moment in time. Refresh it before deciding what to change.</text>
  <text x="64" y="543" class="body">Configured replicas and resource limits alone do not establish available workflow task capacity.</text>
  <text x="40" y="624" class="heading">Deployment changes keep their existing review process</text>
  <g class="card"><rect x="40" y="652" width="320" height="75" rx="14"/><rect x="440" y="652" width="320" height="75" rx="14"/><rect x="840" y="652" width="320" height="75" rx="14"/></g>
  <text x="65" y="698" class="heading">Create and review a plan</text>
  <text x="469" y="698" class="heading">Approve the exact change</text>
  <text x="876" y="698" class="heading">Apply and verify results</text>
  <path class="link" d="M367 690h65"/>
  <path class="link" d="M767 690h65"/>
  <text x="40" y="784" class="small">Lumi provides explanations here. The Operations runner performs only separately authorized changes.</text>
</svg>
