<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870" role="img" aria-labelledby="title desc">
<title id="title">Three integration paths and their commit boundaries</title><desc id="desc">Swimlanes distinguish signed webhooks with atomic receipt and run admission, provider inbox commit before background dispatch, and outbound integration events committed with source mutations.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173D34;font-size:18px}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.bold{font-weight:700}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke:#91B4A3;stroke-width:2;stroke-dasharray:7 6}</style>
<rect width="1120" height="870" fill="#FAFCFA"/>
<text x="40" y="49" class="title">Three integration paths and their commit boundaries</text>
<text x="40" y="84" class="">Choose the ingress contract first; outbound lifecycle notifications use a separate dispatcher.</text>
<text x="40" y="132" class="head">External system</text>
<text x="390" y="132" class="head">Weave durable state</text>
<text x="740" y="132" class="head">Execution / delivery</text>
<rect x="40" y="160" width="290" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="60" y="194" class="head">Signed webhook</text>
<text x="60" y="226" class="">Weave HMAC envelope</text>
<text x="60" y="253" class="">eventId + payload</text>
<text x="60" y="280" class="">Exact bytes + timestamp</text>
<rect x="390" y="160" width="290" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="410" y="194" class="head">One transaction</text>
<text x="410" y="226" class="">Authenticate + authority</text>
<text x="410" y="253" class="">Receipt + run or signal</text>
<text x="410" y="280" class="">Commit, then 202 receipt</text>
<rect x="740" y="160" width="340" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="760" y="194" class="head">Workflow execution</text>
<text x="760" y="226" class="">Native or remote task execution</text>
<text x="760" y="253" class="">Continues from admitted state</text>
<text x="760" y="280" class="">Receipt ≠ completed Workflow</text>
<path class="edge" d="M330 234H380"/>
<path class="edge" d="M680 234H730"/>
<rect x="40" y="365" width="290" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="60" y="399" class="head">Provider ingress</text>
<text x="60" y="431" class="">Provider-specific protocol</text>
<text x="60" y="458" class="">Teams / WhatsApp / Telegram</text>
<text x="60" y="485" class="">Authenticate raw bytes</text>
<rect x="390" y="365" width="290" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="410" y="399" class="head">Inbox transaction</text>
<text x="410" y="431" class="">Protocol facts + receipts</text>
<text x="410" y="458" class="">Pending dispatch intent</text>
<text x="410" y="485" class="">Commit, then provider ACK</text>
<rect x="740" y="365" width="340" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="760" y="399" class="head">Background dispatch</text>
<text x="760" y="431" class="">Recheck source + target authority</text>
<text x="760" y="458" class="">Start pinned run or signal target</text>
<text x="760" y="485" class="">Settle runtime + receipt atomically</text>
<path class="edge" d="M330 439H380"/>
<path class="edge" d="M680 439H730"/>
<rect x="40" y="570" width="290" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="60" y="604" class="head">Notification receiver</text>
<text x="60" y="636" class="">Verify timestamp + HMAC</text>
<text x="60" y="663" class="">Durably deduplicate eventId</text>
<text x="60" y="690" class="">Commit effect, then ACK</text>
<rect x="390" y="570" width="290" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="410" y="604" class="head">Source transaction</text>
<text x="410" y="636" class="">Lifecycle mutation</text>
<text x="410" y="663" class="">Integration event</text>
<text x="410" y="690" class="">Matching delivery intents</text>
<rect x="740" y="570" width="340" height="155" rx="12" fill="#EEF5EF" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="760" y="604" class="head">Outbox dispatcher</text>
<text x="760" y="636" class="">Lease + current authority</text>
<text x="760" y="663" class="">Bounded HTTP attempt</text>
<text x="760" y="690" class="">Record success, retry or incident</text>
<path class="edge" d="M680 644H730"/>
<path class="edge" d="M910 725V759H182V735"/>
<text x="353" y="752" class="">Same event body and identity across attempts</text>
<rect x="40" y="790" width="1040" height="53" rx="12" fill="#E0EEE4" stroke="#BFD6C9" stroke-width="1.5"/>
<text x="60" y="824" class="head"></text>
<text x="60" y="823" class="">All paths need current scoped authority. An acknowledgment has only the meaning stated in its lane.</text>
</svg>
