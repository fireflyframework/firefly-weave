<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 869" role="img" aria-labelledby="title desc">
<title id="title">Definition and connection relationships</title><desc id="desc">A selected relational model with scoped composite keys and parent-to-child cardinalities. See the architecture guide for migration sources and omitted logical references.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173D34}.title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1120" height="869" fill="#FFFFFF"/>
<text x="40" y="50" class="title">Definition and connection relationships</text>
<text x="40" y="85" class="body">Selected actual foreign keys. Arrows point from parent to child; every child has one shown parent.</text>
<text x="40" y="114" class="small">P = tenant_id + project_id. E = P + environment_id. ID columns are shown explicitly.</text>
<rect x="40" y="150" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="60" y="184" class="head">projects</text>
<text x="60" y="215" class="body">Parent key: tenant_id, id</text>
<rect x="610" y="150" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="630" y="184" class="head">definition_versions</text>
<text x="630" y="215" class="body">Child FK: tenant_id, project_id</text>
<path class="edge" d="M513 199L606 199"/>
<text x="531" y="178" class="small">0..*</text>
<rect x="40" y="270" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="60" y="304" class="head">definition_versions</text>
<text x="60" y="335" class="body">Parent key: P, id</text>
<rect x="610" y="270" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="630" y="304" class="head">definition_sources</text>
<text x="630" y="335" class="body">Child FK: P, version_id</text>
<path class="edge" d="M513 319L606 319"/>
<text x="531" y="298" class="small">0..*</text>
<rect x="40" y="390" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="60" y="424" class="head">definition_versions</text>
<text x="60" y="455" class="body">Parent key: P, id</text>
<rect x="610" y="390" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="630" y="424" class="head">activation_revisions</text>
<text x="630" y="455" class="body">Child FK: P, version_id</text>
<path class="edge" d="M513 439L606 439"/>
<text x="531" y="418" class="small">0..*</text>
<rect x="40" y="510" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="60" y="544" class="head">activation_revisions</text>
<text x="60" y="575" class="body">Parent key: E, id</text>
<rect x="610" y="510" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="630" y="544" class="head">activation_connections</text>
<text x="630" y="575" class="body">Child FK: E, activation_id</text>
<path class="edge" d="M513 559L606 559"/>
<text x="531" y="538" class="small">0..*</text>
<rect x="40" y="630" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="60" y="664" class="head">connection_revisions</text>
<text x="60" y="695" class="body">Parent key: E, id</text>
<rect x="610" y="630" width="470" height="95" rx="12" fill="#EEF4F0" stroke="#C9DBD2"/>
<text x="630" y="664" class="head">activation_connections</text>
<text x="630" y="695" class="body">Child FK: E, revision_id</text>
<path class="edge" d="M513 679L606 679"/>
<text x="531" y="658" class="small">0..*</text>
<text x="40" y="764" class="small">Sources: migrations 0004, 0005. Activation also references its environment.</text>
<text x="40" y="792" class="small">Draft revisions and mutation-idempotency records reference the project; immutable versions remain distinct.</text>
<text x="40" y="820" class="small">Worker-release and connection grants add further scoped dependencies; JSON pins are not invented FKs.</text>

</svg>
