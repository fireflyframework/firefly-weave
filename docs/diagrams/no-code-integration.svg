<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1170" viewBox="0 0 1120 1170" role="img" aria-labelledby="title desc">
<title id="title">Call a REST API without writing code</title>
<desc id="desc">Nine steps in three columns. You author: 1, describe one HTTPS request or import operations from OpenAPI, in Studio's API action builder or with the CLI, where samples only set types and their values never enter the Action; 2, the result is an Action on the built-in weave-http@2.0.0 connector whose method sets the side effect, GET and HEAD read-only, other methods writes that are never retried; 3, it is checked offline and again at publish, with a pointer to the field to fix; 4, you publish an immutable version. Your environment allows, with tenant_admin for connections: 5, a connection holds the API's HTTPS origin, the auth kind, and secret handles but never secret values; 6, a grant lets the connector release use those handles, read and write only when needed. Once per environment, the operator enables the built-in weave-http connector, stores secrets behind handles, and grants them; Actions, workflows, and connections hold only names. You deploy and run: 7, a Call an action step uses the Action through a named connection slot; 8, activation binds the slot to a connection revision and the connector to a release and records the Action, connector, and capability digests; 9, the run receives the status and body. Trust boundary: only fixed, first-party executor code runs; it calls only origins listed on the connection, over HTTPS or over plain HTTP flagged Not encrypted, follows no redirects, refuses private, loopback and CGNAT addresses unless the operator allows that origin or network, always refuses link-local and known metadata addresses, caps responses at 1 MiB and calls at 30 seconds, and resolves secrets by handle for the granted release only.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173D34}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.b{font-size:20px;font-weight:700}.p{font-size:20px}.small{font-size:18px;fill:#4D655D}.lbl{font-size:17px}.w{fill:#FFFFFF}.wm{fill:#CEE4D8}.n{font-size:17px;font-weight:700;fill:#FFFFFF}.arrow{fill:none;stroke:#367D68;stroke-width:3;marker-end:url(#arrow)}.ret{fill:none;stroke:#367D68;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}.life{fill:none;stroke:#A8C8B9;stroke-width:2;stroke-dasharray:6 6}.icon{fill:none;stroke:#367D68;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.iconw{fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.halo{paint-order:stroke;stroke:#EEF4F0;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1120" height="1060" rx="24" fill="#EEF4F0"/>
<text class="title" x="40" y="55">Call a REST API without writing code</text>
<text class="p" x="40" y="90">Describe the request, allow it in your environment, then pin it and run it.</text>
<rect x="40" y="118" width="330" height="46" rx="12" fill="#173D34"/><text class="b w" x="62" y="148">You author</text>
<rect x="395" y="118" width="330" height="46" rx="12" fill="#173D34"/><text class="b w" x="417" y="148">Your environment allows</text>
<rect x="750" y="118" width="330" height="46" rx="12" fill="#173D34"/><text class="b w" x="772" y="148">You deploy and run</text>
<rect x="40" y="184" width="330" height="166" rx="14" fill="white"/>
<circle cx="68" cy="213" r="15" fill="#367D68"/><text class="n" x="68" y="219" text-anchor="middle">1</text>
<text class="b" x="94" y="220">Describe or import</text>
<text class="lbl" x="62" y="250">Describe one HTTPS request, or</text>
<text class="lbl" x="62" y="275">import operations from OpenAPI,</text>
<text class="lbl" x="62" y="300">in Studio or with the CLI.</text>
<text class="lbl" x="62" y="325">Samples only set the types.</text>
<path class="arrow" d="M205 350V378"/>
<rect x="40" y="380" width="330" height="166" rx="14" fill="white"/>
<circle cx="68" cy="409" r="15" fill="#367D68"/><text class="n" x="68" y="415" text-anchor="middle">2</text>
<text class="b" x="94" y="416">A weave-http Action</text>
<text class="lbl" x="62" y="446">Built on weave-http@2.0.0.</text>
<text class="lbl" x="62" y="471">The method sets the side effect:</text>
<text class="lbl" x="62" y="496">GET, HEAD: read, read-only.</text>
<text class="lbl" x="62" y="521">Others: write, never retried.</text>
<path class="arrow" d="M205 546V574"/>
<rect x="40" y="576" width="330" height="166" rx="14" fill="white"/>
<circle cx="68" cy="605" r="15" fill="#367D68"/><text class="n" x="68" y="611" text-anchor="middle">3</text>
<text class="b" x="94" y="612">Check it</text>
<text class="lbl" x="62" y="642">Checked offline against the</text>
<text class="lbl" x="62" y="667">bundled connector description.</text>
<text class="lbl" x="62" y="692">Publishing checks again and</text>
<text class="lbl" x="62" y="717">points at the field to fix.</text>
<path class="arrow" d="M205 742V770"/>
<rect x="40" y="772" width="330" height="116" rx="14" fill="white"/>
<circle cx="68" cy="801" r="15" fill="#367D68"/><text class="n" x="68" y="807" text-anchor="middle">4</text>
<text class="b" x="94" y="808">Publish</text>
<text class="lbl" x="62" y="838">An immutable version, such as</text>
<text class="lbl" x="62" y="863">get-todo@1.0.0.</text>
<path class="arrow" d="M370 830H382V267H391"/>
<rect x="395" y="184" width="330" height="166" rx="14" fill="white"/>
<circle cx="423" cy="213" r="15" fill="#367D68"/><text class="n" x="423" y="219" text-anchor="middle">5</text>
<text class="b" x="449" y="220">Create a connection</text>
<text class="lbl" x="417" y="250">The API’s HTTPS origin, the auth</text>
<text class="lbl" x="417" y="275">kind, and secret handles</text>
<text class="lbl" x="417" y="300">(SLOT=HANDLE), never values.</text>
<text class="lbl" x="417" y="325">Only listed origins are allowed.</text>
<path class="arrow" d="M560 350V378"/>
<rect x="395" y="380" width="330" height="166" rx="14" fill="white"/>
<circle cx="423" cy="409" r="15" fill="#367D68"/><text class="n" x="423" y="415" text-anchor="middle">6</text>
<text class="b" x="449" y="416">Grant the handles</text>
<text class="lbl" x="417" y="446">Let the connector release use</text>
<text class="lbl" x="417" y="471">this connection’s handles: read,</text>
<text class="lbl" x="417" y="496">and write only when needed.</text>
<text class="lbl" x="417" y="521">No handles, no grant needed.</text>
<rect x="395" y="576" width="330" height="140" rx="14" fill="#FFF7E5"/>
<text class="b" x="417" y="612">Once per environment</text>
<text class="lbl" x="417" y="642">The operator enables weave-http,</text>
<text class="lbl" x="417" y="667">stores secrets behind handles,</text>
<text class="lbl" x="417" y="692">and grants them; you see names.</text>
<path class="arrow" d="M725 463H737V267H746"/>
<rect x="750" y="184" width="330" height="141" rx="14" fill="white"/>
<circle cx="778" cy="213" r="15" fill="#367D68"/><text class="n" x="778" y="219" text-anchor="middle">7</text>
<text class="b" x="804" y="220">Use a connection slot</text>
<text class="lbl" x="772" y="250">A Call an action step uses</text>
<text class="lbl" x="772" y="275">get-todo@1.0.0 through a named</text>
<text class="lbl" x="772" y="300">slot, such as todos.</text>
<path class="arrow" d="M915 325V353"/>
<rect x="750" y="355" width="330" height="141" rx="14" fill="white"/>
<circle cx="778" cy="384" r="15" fill="#367D68"/><text class="n" x="778" y="390" text-anchor="middle">8</text>
<text class="b" x="804" y="391">Activate with pins</text>
<text class="lbl" x="772" y="421">Binds the slot to a connection</text>
<text class="lbl" x="772" y="446">revision and the connector to a</text>
<text class="lbl" x="772" y="471">release; records the digests.</text>
<path class="arrow" d="M915 496V524"/>
<rect x="750" y="526" width="330" height="141" rx="14" fill="white"/>
<circle cx="778" cy="555" r="15" fill="#367D68"/><text class="n" x="778" y="561" text-anchor="middle">9</text>
<text class="b" x="804" y="562">Run</text>
<text class="lbl" x="772" y="592">The executor sends the request.</text>
<text class="lbl" x="772" y="617">The run receives the status and</text>
<text class="lbl" x="772" y="642">body, then continues.</text>
<path d="M738 686H1094V1050H26V900H738Z" fill="none" stroke="#367D68" stroke-width="2" stroke-dasharray="8 6" stroke-linejoin="round"/>
<rect x="750" y="700" width="330" height="188" rx="14" fill="#173D34"/>
<g class="iconw" transform="translate(772 722)"><path d="M3 2l20-7 20 7v20c0 14-20 24-20 24S3 36 3 22Z"/><path d="M14 18l7 7 13-16"/></g>
<text class="b w" x="832" y="742">Fixed, first-party</text>
<text class="b w" x="832" y="767">executor</text>
<text class="lbl wm" x="772" y="808">Only built-in weave-http@2.0.0</text>
<text class="lbl wm" x="772" y="833">code runs, pinned by digest.</text>
<text class="lbl wm" x="772" y="858">Nothing you author runs as code.</text>
<path class="arrow" d="M915 667V698"/>
<text class="h" x="64" y="946">Trust boundary: egress rules on every call</text>
<text class="small" x="64" y="976">Only origins listed on the connection; HTTP is flagged “Not encrypted”; no redirects. Private, loopback</text>
<text class="small" x="64" y="1002">and CGNAT addresses need an origin or network the operator allows; link-local and metadata are always refused.</text>
<text class="small" x="64" y="1028">Responses stop at 1 MiB and calls at 30 seconds. Secrets resolve by handle for the granted release only.</text>
<g id="lumi-takeaway">
<rect x="0" y="1072" width="1120" height="90" rx="16" fill="#EAF4ED"/>
<g transform="translate(22 1083) scale(.25)"><defs>
