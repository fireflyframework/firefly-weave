</g></g>
<text x="110" y="710" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="741" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">The same message can be simulated locally or saved in a durable run.</text>
</g>
</svg>
