<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1234" viewBox="0 0 960 1234" role="img" aria-labelledby="title desc">
<title id="title">Bring your own identity provider</title>
<desc id="desc">Two parts. Set up once, in this order: 1, in your identity provider, register the API audience and separate clients for host apps, workers, and the people who sign in; 2, set WEAVE_OIDC_PROVIDERS on the API with the issuer, JWKS URL, audience, and each client as human or application, for RS256 or ES256 access tokens; 3, set WEAVE_CLIENT_SIGN_IN to publish the provider, login client, scopes, and flows (browser, device), which clients read without a token from GET /api/v1/client-configuration; 4, in your identity provider, make the login client public with no secret, PKCE S256, callbacks registered without a port (http://127.0.0.1/callback and http://[::1]/callback), and an optional device authorization grant; 5, as a Weave administrator, link the provider, issuer, and subject to a person and grant a role in a workspace, because a matching email is not an identity link; 6, verify one person: run weave auth setup, which prints the provider and subject to link when the account is not linked yet, then weave auth status --check. Then, on every request, read left to right: the provider authenticates the caller and issues a token, the client sends it as a bearer token, and the API verifies the signature, issuer, audience, client, and token class, finds the identity link to a person, and checks for a role for this operation in this workspace. A valid token alone grants nothing. For local development, weave platform setup prepares its own Keycloak for steps 1 to 4, and weave platform user links a person with grants.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173D34}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.muted{fill:#536D60}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.icon{fill:none;stroke:#367D68;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.tag{font-size:16px;font-weight:700;fill:#326B88}.box{font-size:16px}.bh{font-size:18px;font-weight:700}.num{font-size:20px;font-weight:700;fill:#FFFFFF}</style>
<rect width="960" height="1128" rx="16" fill="#F7FAF8"/>
<text x="36" y="49" class="title">Bring your own identity provider</text>
<text x="36" y="84" class="body muted">Authentication belongs to your provider. Permissions belong to Weave.</text>
<text x="36" y="138" class="head">Set up once, in this order (steps 1 to 6 below)</text>
<rect x="36" y="158" width="424" height="196" rx="14" fill="white" stroke="#A8BDB1"/>
<circle cx="72" cy="194" r="18" fill="#367D68"/><text x="72" y="201" class="num" text-anchor="middle">1</text>
<text x="102" y="202" class="head">Register API and clients</text>
<text x="56" y="236" class="tag">IN YOUR IDENTITY PROVIDER</text>
<text x="56" y="266" class="small">The API audience, plus separate clients</text>
<text x="56" y="291" class="small">for host apps, workers, and the people</text>
<text x="56" y="316" class="small">who sign in with the CLI or Studio.</text>
<rect x="500" y="158" width="424" height="196" rx="14" fill="white" stroke="#A8BDB1"/>
<circle cx="536" cy="194" r="18" fill="#367D68"/><text x="536" y="201" class="num" text-anchor="middle">2</text>
<text x="566" y="202" class="head">Trust the provider</text>
<text x="520" y="236" class="tag">API SETTING • WEAVE_OIDC_PROVIDERS</text>
<text x="520" y="266" class="small">Issuer, JWKS URL, audience, and each</text>
<text x="520" y="291" class="small">client as human or application. Access</text>
<text x="520" y="316" class="small">tokens must be signed RS256 or ES256.</text>
<rect x="36" y="370" width="424" height="196" rx="14" fill="white" stroke="#A8BDB1"/>
<circle cx="72" cy="406" r="18" fill="#367D68"/><text x="72" y="413" class="num" text-anchor="middle">3</text>
<text x="102" y="414" class="head">Publish sign-in settings</text>
<text x="56" y="448" class="tag">API SETTING • WEAVE_CLIENT_SIGN_IN</text>
<text x="56" y="478" class="small">Provider, login client, scopes, and flows</text>
<text x="56" y="503" class="small">(browser, device). Clients read them with</text>
<text x="56" y="528" class="small">no token: GET /api/v1/client-configuration</text>
<rect x="500" y="370" width="424" height="196" rx="14" fill="white" stroke="#A8BDB1"/>
<circle cx="536" cy="406" r="18" fill="#367D68"/><text x="536" y="413" class="num" text-anchor="middle">4</text>
<text x="566" y="414" class="head">Set up the login client</text>
<text x="520" y="448" class="tag">IN YOUR IDENTITY PROVIDER</text>
<text x="520" y="478" class="small">Public client: no secret, PKCE S256.</text>
<text x="520" y="503" class="small">Callbacks registered without a port:</text>
<text x="520" y="528" class="small">http://127.0.0.1/callback, http://[::1]/callback</text>
<text x="520" y="553" class="small">Device authorization grant: optional.</text>
<rect x="36" y="582" width="424" height="196" rx="14" fill="white" stroke="#A8BDB1"/>
<circle cx="72" cy="618" r="18" fill="#367D68"/><text x="72" y="625" class="num" text-anchor="middle">5</text>
<text x="102" y="626" class="head">Link and grant access</text>
<text x="56" y="660" class="tag">WEAVE ADMINISTRATOR</text>
<text x="56" y="690" class="small">Link provider, issuer, and subject to a</text>
<text x="56" y="715" class="small">person, then grant a role in a workspace.</text>
<text x="56" y="740" class="small">A matching email is not an identity link.</text>
<rect x="500" y="582" width="424" height="196" rx="14" fill="white" stroke="#A8BDB1"/>
<circle cx="536" cy="618" r="18" fill="#367D68"/><text x="536" y="625" class="num" text-anchor="middle">6</text>
<text x="566" y="626" class="head">Verify one person</text>
<text x="520" y="660" class="tag">THE PERSON SIGNING IN</text>
<text x="520" y="690" class="small">Run weave auth setup. Not linked yet? It</text>
<text x="520" y="715" class="small">prints the provider and subject to link.</text>
<text x="520" y="740" class="small">Then run weave auth status --check.</text>
<path class="edge" d="M464 256H494"/>
<path class="edge" d="M464 468H494"/>
<path class="edge" d="M464 680H494"/>
<text x="36" y="830" class="head">Then, on every request</text>
<rect x="36" y="850" width="160" height="130" rx="12" fill="white" stroke="#A8BDB1"/>
<text x="50" y="882" class="bh">Get a token</text>
<text x="50" y="912" class="box">Your provider</text>
<text x="50" y="935" class="box">authenticates</text>
<text x="50" y="958" class="box">the caller.</text>
<path class="edge" d="M199 915H215"/>
<rect x="218" y="850" width="160" height="130" rx="12" fill="white" stroke="#A8BDB1"/>
<text x="232" y="882" class="bh">Call the API</text>
<text x="232" y="912" class="box">The client sends</text>
<text x="232" y="935" class="box">a bearer token.</text>
<path class="edge" d="M381 915H397"/>
<rect x="400" y="850" width="160" height="130" rx="12" fill="#EAF4ED" stroke="#A8BDB1"/>
<text x="414" y="882" class="bh">Verify it</text>
<text x="414" y="912" class="box">Signature, issuer,</text>
<text x="414" y="935" class="box">audience, client,</text>
<text x="414" y="958" class="box">token class.</text>
<path class="edge" d="M563 915H579"/>
<rect x="582" y="850" width="160" height="130" rx="12" fill="#EAF4ED" stroke="#A8BDB1"/>
<text x="596" y="882" class="bh">Find the link</text>
<text x="596" y="912" class="box">Provider, issuer,</text>
<text x="596" y="935" class="box">and subject map</text>
<text x="596" y="958" class="box">to a person.</text>
<path class="edge" d="M745 915H761"/>
<rect x="764" y="850" width="160" height="130" rx="12" fill="#EAF4ED" stroke="#A8BDB1"/>
<text x="778" y="882" class="bh">Check grants</text>
<text x="778" y="912" class="box">A role for this</text>
<text x="778" y="935" class="box">operation in this</text>
<text x="778" y="958" class="box">workspace?</text>
<text x="36" y="1010" class="small muted">Shaded boxes run in the Weave API. A valid token alone grants nothing.</text>
<rect x="36" y="1030" width="888" height="70" rx="12" fill="#EAF4ED"/>
<text x="56" y="1059" class="small"><tspan font-weight="700">Local development:</tspan> weave platform setup prepares its own Keycloak for</text>
<text x="56" y="1084" class="small">steps 1 to 4, and weave platform user links a person with grants (step 5).</text>
<g id="lumi-takeaway">
<rect x="0" y="1134" width="960" height="90" rx="16" fill="#EAF4ED"/>
