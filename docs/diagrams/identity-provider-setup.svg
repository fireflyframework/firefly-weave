<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title desc">
<title id="title">Bring your own identity provider</title>
<desc id="desc">A client obtains an access token from your provider. Weave verifies the token against configured signing keys, links the verified subject to a principal, and checks local grants before executing an operation. Keycloak is provided only for the local development setup.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367D68"/></marker></defs>
<style>text{font-family:"Avenir Next",Arial,sans-serif;fill:#173D34}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.muted{fill:#536D60}.edge{fill:none;stroke:#367D68;stroke-width:2.5;marker-end:url(#arrow)}.icon{fill:none;stroke:#367D68;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="960" height="834" rx="16" fill="#F7FAF8"/>
<text x="36" y="49" class="title">Bring your own identity provider</text>
<text x="36" y="84" class="body muted">Authentication belongs to your provider. Permissions belong to Weave.</text>
<rect x="36" y="116" width="888" height="78" rx="12" fill="#EAF4ED"/>
<text x="56" y="148" class="head">Local development: Keycloak is supplied for you.</text>
<text x="56" y="178" class="small">Your deployment: configure a compatible OIDC/CIAM provider and its token contract.</text>
<rect x="36" y="229" width="264" height="195" rx="14" fill="white" stroke="#A8BDB1"/>
<g class="icon" transform="translate(56 250)"><circle cx="16" cy="10" r="9"/><path d="M0 40V35C0 18 32 18 32 35V40"/></g>
<text x="56" y="317" class="head">1. Get a token</text>
<text x="56" y="351" class="body">Your identity provider</text>
<text x="56" y="379" class="small">Authenticates the caller</text>
<text x="56" y="404" class="small">Issues an API access token</text>
<path class="edge" d="M302 316H344"/>
<rect x="348" y="229" width="264" height="195" rx="14" fill="white" stroke="#A8BDB1"/>
<g class="icon" transform="translate(370 250)"><rect width="40" height="29" rx="3"/><path d="M7 39H33M20 29V39M9 9L15 15L9 21M22 21H30"/></g>
<text x="368" y="317" class="head">2. Call the API</text>
<text x="368" y="351" class="body">Your client</text>
<text x="368" y="379" class="small">CLI, SDK, or HTTP</text>
<text x="368" y="404" class="small">Sends a bearer token</text>
<path class="edge" d="M614 316H656"/>
<rect x="660" y="229" width="264" height="195" rx="14" fill="#EAF4ED" stroke="#A8BDB1"/>
<g class="icon" transform="translate(682 250)"><path d="M0 6L20 0L40 6V22Q35 35 20 43Q5 35 0 22Z M10 20L17 27L30 13"/></g>
<text x="680" y="317" class="head">3. Verify identity</text>
<text x="680" y="351" class="body">Weave API</text>
<text x="680" y="379" class="small">Signature, issuer, audience</text>
<text x="680" y="404" class="small">Allowed client + token class</text>
<path class="edge" d="M792 424V566"/>
<text x="40" y="467" class="head">Configured trust, not a vendor dependency</text>
<text x="40" y="501" class="small">Trusted signing keys come from your configured JWKS URL.</text>
<text x="40" y="531" class="small">No provider administrator credential is needed in the API.</text>
<rect x="36" y="570" width="418" height="161" rx="14" fill="white" stroke="#A8BDB1"/>
<text x="56" y="607" class="head">5. Check permission</text>
<text x="56" y="643" class="body">Does this principal have a grant</text>
<text x="56" y="671" class="body">for this operation in this scope?</text>
<text x="56" y="705" class="small muted">Only then may the operation proceed.</text>
<rect x="506" y="570" width="418" height="161" rx="14" fill="white" stroke="#A8BDB1"/>
<text x="526" y="607" class="head">4. Resolve the identity link</text>
<text x="526" y="643" class="body">Provider + issuer + verified subject</text>
<text x="526" y="671" class="body">map to an active Weave principal.</text>
<text x="526" y="705" class="small muted">An email match is not an identity link.</text>
<path class="edge" d="M504 651H458"/>
<text x="36" y="782" class="body">A valid token does not automatically grant access to workflows or tasks.</text>
<g id="lumi-takeaway">
<rect x="0" y="846" width="960" height="90" rx="16" fill="#EAF4ED"/>
<g transform="translate(22 857) scale(.25)"><defs>
  <radialGradient id="lumi-face" cx=".3" cy=".2" r=".9">
    <stop stop-color="#3C6957"/><stop offset=".55" stop-color="#1C463A"/>
    <stop offset="1" stop-color="#102E28"/>
  </radialGradient>
  <linearGradient id="lumi-eye" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8DCC8"/>
  </linearGradient>
  <linearGradient id="lumi-lantern" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFEDAD"/><stop offset="1" stop-color="#DDA743"/></linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <path d="M113 89C109 67 100 51 89 45M143 89C147 67 156 51 167 45" fill="none" stroke="#315C4E" stroke-width="3.5"/>
  <path d="M102 134Q128 122 154 134L153 184C153 206 142 219 128 219C114 219 103 206 103 184Z" fill="#173D34"/>
  <path d="M107 177Q128 185 149 177L148 191C146 205 138 213 128 213C118 213 110 205 108 191Z" fill="url(#lumi-lantern)"/>
  <path d="M30 83L56 61Q61 57 66 64L142 174L130 193L28 91Q24 86 30 83Z" fill="#173D34"/>
  <path d="M57 63L135 175L129 185L30 87Z" fill="#78B89C"/>
  <path d="M57 63L96 119L72 111L30 87Z" fill="#C7E6D7"/>
  <path d="M72 111L96 119L135 175L129 185Z" fill="#4F9479"/>
  <path d="M226 83L200 61Q195 57 190 64L111 178L127 194L228 91Q232 86 226 83Z" fill="#173D34"/>
  <path d="M199 63L116 178L127 187L226 87Z" fill="#A1D1B9"/>
  <path d="M199 63L160 119L184 111L226 87Z" fill="#D8EEE3"/>
  <path d="M184 111L160 119L116 178L127 187Z" fill="#68AA8D"/>
  <g transform="rotate(-5 128 120)">
    <path d="M94 115C93 95 108 81 128 81C148 81 163 95 162 115
      C162 135 150 152 130 158C109 155 95 138 94 115Z" fill="url(#lumi-face)"/>
    <path d="M98 111C98 96 110 86 124 85" fill="none" stroke="#83AF94"
      stroke-width="1.2" opacity=".5"/>
    <path d="M128 87C124 99 124 106 126 112" fill="none" stroke="#58856B"
      stroke-width="1" opacity=".4"/>
    <path d="M103 114C104 106 111 103 117 107C124 111 124 120 119 126
      C111 131 104 124 103 114Z" fill="#0C2923"/>
    <path d="M105 114C106 109 111 107 116 110C120 113 121 120 117 124
      C111 127 106 122 105 114Z" fill="url(#lumi-eye)"/>
    <ellipse cx="114.5" cy="116.5" rx="3.3" ry="5.4" fill="#173D34"/>
    <circle cx="115.5" cy="113.5" r="1.4" fill="#FFFFFF"/>
    <path d="M135 112C138 105 145 103 151 108C156 114 153 124 147 127
      C139 129 133 120 135 112Z" fill="#0C2923"/>
    <path d="M137 113C139 108 144 107 148 110C152 114 150 121 146 124
      C140 126 136 120 137 113Z" fill="url(#lumi-eye)"/>
    <ellipse cx="145" cy="116" rx="3.3" ry="5.4" fill="#173D34"/>
    <circle cx="146" cy="113" r="1.4" fill="#FFFFFF"/>
    <path d="M106 101Q112 98 118 102M137 101Q143 98 149 102"
      fill="none" stroke="#6C997E" stroke-width="1.8" opacity=".65"/>
    <path d="M122 140Q129 143 136 139" fill="none" stroke="#84B295" stroke-width="1.5"/>
  </g>
</g></g>
<text x="110" y="875" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="906" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Your provider proves identity. Weave grants decide what happens next.</text>
</g>
</svg>
