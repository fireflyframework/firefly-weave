      fill="none" stroke="#6C997E" stroke-width="1.8" opacity=".65"/>
    <path d="M122 140Q129 143 136 139" fill="none" stroke="#84B295" stroke-width="1.5"/>
  </g>
</g></g>
<text x="110" y="1163" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="1194" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Your provider proves identity. Weave grants decide what happens next.</text>
</g>
</svg>
