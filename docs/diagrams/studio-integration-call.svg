<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
<title id="title">An integration step chooses an Action. The Action chooses the implementation.</title>
<desc id="desc">Read from top to bottom. A workflow action step selects an exact published Action version, business input, and a logical connection slot. The Action defines schemas, timeout, retries, and side effects. It invokes either an installed connector operation or an admitted remote worker handler. Activation binds the environment's authorized connection; credentials are not stored in workflow input. The executor calls the external system and returns a result to the durable run.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#367D68"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173D34}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.p{font-size:20px}.small{font-size:18px;fill:#4D655D}.arrow{fill:none;stroke:#367D68;stroke-width:3;marker-end:url(#arrow)}.icon{fill:none;stroke:#367D68;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="1000" rx="24" fill="#EEF4F0"/>
<text class="title" x="40" y="55">What does “Call an integration” actually call?</text>
<text class="p" x="40" y="90">Follow one step from your process to the external system.</text>
<rect x="50" y="125" width="650" height="180" rx="16" fill="white"/>
<g class="icon" transform="translate(74 151)"><rect width="16" height="16" rx="3"/><rect x="27" y="27" width="16" height="16" rx="3"/><path d="M8 16v19h19"/></g>
<text class="h" x="137" y="177">1. Your workflow step</text>
<text class="p" x="74" y="222">Action version: notify-customer@1.0.0</text>
<text class="p" x="74" y="253">Input: customer and message data</text>
<text class="small" x="74" y="283">Connection slot: notifications</text>
<path class="arrow" d="M375 305V350"/>
<rect x="50" y="360" width="650" height="183" rx="16" fill="#173D34"/>
<text class="h" x="74" y="401" style="fill:white">2. The published Action contract</text>
<text class="p" x="74" y="442" style="fill:white">Defines accepted input and returned output.</text>
<text class="p" x="74" y="476" style="fill:white">Pins the implementation, timeout, and retry policy.</text>
<text class="small" x="74" y="514" style="fill:#CEE4D8">Changing this contract means publishing a new version.</text>
<rect x="745" y="200" width="325" height="295" rx="16" fill="#FFF7E5"/>
<g class="icon" transform="translate(770 225)"><path d="M0 5l20-5 20 5v16c0 12-20 23-20 23S0 33 0 21Z"/><path d="M10 20l7 7 14-15"/></g>
<text class="h" x="770" y="302">Environment binding</text>
<text class="p" x="770" y="344">Activation maps the slot</text>
<text class="p" x="770" y="374">to an authorized</text>
<text class="p" x="770" y="404">connection revision.</text>
<text class="small" x="770" y="449">Secrets stay outside</text>
<text class="small" x="770" y="475">your workflow definition.</text>
<path class="arrow" d="M375 543v37H285v42"/>
<path class="arrow" d="M375 580h460v42"/>
<text class="small" x="486" y="572">One implementation</text>
<rect x="50" y="632" width="475" height="172" rx="16" fill="white"/>
<g class="icon" transform="translate(74 654)"><path d="M9 0v12M27 0v12M1 12h34v8a17 17 0 0 1-34 0ZM18 37v10"/></g>
<text class="h" x="130" y="684">3a. Connector operation</text>
<text class="p" x="74" y="733">An installed adapter calls its operation.</text>
<text class="small" x="74" y="774">Example: an email send operation.</text>
<rect x="570" y="632" width="500" height="172" rx="16" fill="white"/>
<g class="icon" transform="translate(595 654)"><rect width="36" height="36" rx="5"/><path d="M8 11l7 7-7 7M20 26h9"/></g>
<text class="h" x="651" y="684">3b. Remote worker task</text>
<text class="p" x="595" y="733">Your admitted handler executes the call.</text>
<text class="small" x="595" y="774">Example: your company's service client.</text>
<path class="arrow" d="M285 804v31h275v34"/><path class="arrow" d="M835 804v31H560"/>
<rect x="50" y="880" width="1020" height="80" rx="16" fill="#DCEBE3"/>
<text class="h" x="74" y="914">4. The external system receives the request</text>
<text class="small" x="74" y="944">The executor reports the result; Weave records progress and continues the process.</text>
</svg>
