<text x="110" y="769" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="800" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Search by key, then act on one exact run ID.</text>
</g>
