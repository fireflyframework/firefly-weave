<text x="110" y="1377" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#367D68">Lumi’s takeaway</text>
<text x="110" y="1408" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#173D34">Keep process identities separate and reuse the installation’s saved receipts.</text>
</g>
