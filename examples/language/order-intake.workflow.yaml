# Call a workflow and wait for its result, then start another call without waiting. The compiler reports
# "not yet supported" for callWorkflow, concat and join until a later release adds them.
apiVersion: weave/v1alpha1
kind: Workflow
metadata:
  name: order-intake
  version: 1.0.0
spec:
  inputSchema:
    type: object
    properties:
      customerId: {type: string}
      orderId: {type: string}
      tags:
        type: array
        items: {type: string}
    required: [customerId, orderId, tags]
    additionalProperties: false
  outputSchema:
    type: object
  steps:
    - id: notify
      kind: callWorkflow
      uses: notify-customer@1.0.0
      with:
        object:
          customerId: {ref: /input/customerId}
          message:
            op:
              name: concat
              args: [{literal: "Order "}, {ref: /input/orderId}, {literal: " received"}]
      mode: wait
      onFailure: continue
      businessKey: {ref: /input/orderId}
    - id: audit
      kind: callWorkflow
      uses: notify-customer@1.0.0
      with:
        object:
          customerId: {literal: auditor}
          message:
            op:
              name: join
              args: [{ref: /input/tags}, {literal: ", "}]
      mode: detach
  output:
    object:
      notification: {ref: /steps/notify/output/status}
