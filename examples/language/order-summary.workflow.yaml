# Text from data: concat builds a title from text, a number and a Boolean, and join lists the items. Numbers are
# written as JavaScript writes them, so a total of 2.0 reads "2". Runs on platforms that list text.concat and text.join.
apiVersion: weave/v1alpha1
kind: Workflow
metadata:
  name: order-summary
  version: 1.0.0
spec:
  inputSchema:
    type: object
    properties:
      number: {type: string}
      total: {type: number}
      express: {type: boolean}
      items:
        type: array
        items: {type: string}
    required: [number, total, express, items]
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      title: {type: string}
      lines: {type: string}
    required: [title, lines]
    additionalProperties: false
  steps:
    - id: title
      kind: transform
      value:
        op:
          name: concat
          args:
            - {literal: "Order "}
            - {ref: /input/number}
            - {literal: " totals "}
            - {ref: /input/total}
            - {literal: ", express: "}
            - {ref: /input/express}
    - id: lines
      kind: transform
      value:
        op:
          name: join
          args: [{ref: /input/items}, {literal: ", "}]
  output:
    object:
      title: {ref: /steps/title/output}
      lines: {ref: /steps/lines/output}
