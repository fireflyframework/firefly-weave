# A sub-workflow: "spec.callable" lets other workflows in the project call this exact version.
apiVersion: weave/v1alpha1
kind: Workflow
metadata:
  name: notify-customer
  version: 1.0.0
spec:
  callable: {}
  inputSchema:
    type: object
    properties:
      customerId: {type: string}
      message: {type: string}
    required: [customerId, message]
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      customerId: {type: string}
      delivered: {type: boolean}
    required: [customerId, delivered]
    additionalProperties: false
  steps:
    - id: record
      kind: transform
      value:
        object:
          customerId: {ref: /input/customerId}
          delivered: {literal: true}
  output: {ref: /steps/record/output}
