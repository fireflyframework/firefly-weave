# Move a quantity from one system to another as one transaction: reserve it in the source, add it to the target,
# then submit the order, the step that can't be undone. If anything fails before the order is submitted, Weave
# reverses the addition and releases the reservation, in that order. A platform publishes this workflow once it
# runs transactions.
apiVersion: weave/v1alpha1
kind: Workflow
metadata:
  name: move-between-systems
  version: 1.0.0
spec:
  inputSchema:
    type: object
    properties:
      moveId: {type: string, minLength: 1, maxLength: 200}
      quantity: {type: integer, minimum: 1}
    required: [moveId, quantity]
    additionalProperties: false
  outputSchema: {}
  steps:
    - id: move
      kind: transaction
      businessKey: {ref: /input/moveId}
      steps:
        - id: hold
          kind: action
          uses: source-system.hold-quantity@1.0.0
          with: {object: {quantity: {ref: /input/quantity}, reference: {ref: /input/moveId}}}
          confirm:
            kind: action
            uses: source-system.confirm-hold@1.0.0
            # A confirm runs only after the hold succeeded, so it can use the hold's result.
            with: {object: {holdId: {ref: /steps/hold/output/holdId}}}
          cancel:
            kind: action
            uses: source-system.release-hold@1.0.0
            # The release must work even when the hold's result is unknown, so it names the hold by its inputs.
            with: {object: {reference: {ref: /input/moveId}, holdOperation: {ref: /participant/operationKey}}}
          holdSeconds: 600
        - id: add
          kind: action
          uses: target-system.add-quantity@1.0.0
          with: {object: {quantity: {ref: /input/quantity}, reference: {ref: /input/moveId}}}
          compensate:
            kind: callWorkflow
            uses: reverse-target-addition@1.0.0
            with: {object: {reference: {ref: /input/moveId}, addOperation: {ref: /participant/operationKey}}}
        - id: submit
          kind: action
          uses: orders.submit-order@1.0.0
          with: {object: {reference: {ref: /input/moveId}}}
          irreversible: true
      output: {ref: /steps/submit/output}
  output: {ref: /steps/move/output}
