# Loop over items with a text template. The compiler reports "not yet supported" for forEach and concat
# until a later release adds them; the document shape is final.
apiVersion: weave/v1alpha1
kind: Workflow
metadata:
  name: notify-overdue
  version: 1.0.0
spec:
  inputSchema:
    type: object
    properties:
      invoices:
        type: array
        items:
          type: object
          properties:
            number: {type: string}
            customerEmail: {type: string}
            daysLate: {type: integer}
          required: [number, customerEmail, daysLate]
          additionalProperties: false
    required: [invoices]
    additionalProperties: false
  outputSchema:
    type: object
  connections:
    mail:
      connector: weave-email@1.0.0
  steps:
    - id: notify
      kind: forEach
      items: {ref: /input/invoices}
      concurrency: 4
      maxItems: 500
      collect: all
      body:
        steps:
          - id: send
            kind: action
            uses: mail.send-reminder@1.0.0
            connection: mail
            with:
              object:
                to: {ref: /item/customerEmail}
                subject:
                  op:
                    name: concat
                    args:
                      - {literal: "Invoice "}
                      - {ref: /item/number}
                      - {literal: " is overdue by "}
                      - {ref: /item/daysLate}
                      - {literal: " days"}
        output:
          object:
            invoice: {ref: /item/number}
            messageId: {ref: /steps/send/output/id}
  output:
    object:
      sent: {ref: /steps/notify/output}
