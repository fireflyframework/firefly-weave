apiVersion: weave/v1alpha1
kind: Action
metadata:
  name: sql.lookup-customer
  version: "1.0.0"
spec:
  implementation:
    kind: connector
    uses: weave-postgresql@1.0.0
    action: read
    config:
      statement: SELECT customer_id, status FROM business.customers WHERE customer_id = :customerId LIMIT :rowLimit
      parameters:
        customerId: {type: string, maxLength: 128}
        rowLimit: {type: integer, minimum: 1, maximum: 100}
      maxRows: 100
      maxBytes: 65536
      statementTimeoutMs: 5000
      mappings: {}
  connection:
    connector: weave-postgresql@1.0.0
  sideEffect: read_only
  timeoutSeconds: 30
  inputSchema:
    type: object
    additionalProperties: false
    required: [parameters]
    properties:
      parameters:
        type: object
        additionalProperties: false
        required: [customerId, rowLimit]
        properties:
          customerId: {type: string, maxLength: 128}
          rowLimit: {type: integer, minimum: 1, maximum: 100}
  outputSchema:
    type: object
    additionalProperties: false
    required: [rowCount, rows]
    properties:
      rowCount: {type: integer, minimum: 0}
      rows:
        type: array
        items: {type: object}
