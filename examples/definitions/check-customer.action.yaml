apiVersion: weave/v1alpha1
kind: Action
metadata:
  name: onboarding.check-customer
  version: "1.0.0"
spec:
  implementation:
    kind: worker
    taskType: onboarding.check-customer
    taskVersion: "1.0.0"
  sideEffect: read_only
  timeoutSeconds: 60
  retry:
    maxAttempts: 3
    initialDelaySeconds: 2
    maxDelaySeconds: 30
  inputSchema:
    type: object
    additionalProperties: false
    required: [customerId]
    properties:
      customerId: {type: string, minLength: 1}
  outputSchema:
    type: object
    additionalProperties: false
    required: [eligible]
    properties:
      eligible: {type: boolean}
