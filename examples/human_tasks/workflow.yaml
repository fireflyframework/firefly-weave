apiVersion: weave/v1alpha1
kind: Workflow
metadata:
  name: expense-approval
  version: 1.0.0
spec:
  inputSchema:
    type: object
  outputSchema:
    type: object
  timeoutSeconds: 3600
  steps:
    - id: review
      kind: humanTask
      assignment: expense-reviewers
      title: {literal: Review expense}
      context: {ref: /input}
      formSchema:
        type: object
        properties:
          note: {type: string}
        required: [note]
        additionalProperties: false
      decisions: [approve, reject]
      dueSeconds: 300
      expirySeconds: 1800
  output: {ref: /steps/review/output}
