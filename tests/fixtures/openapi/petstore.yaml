# A small petstore-like OpenAPI 3.1 document for no-code import tests. Some
# operations deliberately need an explicit relaxation; /health has no
# operationId. No request is ever sent to the example server.
openapi: 3.1.0
info:
  title: Pet Store
  version: "1.0"
servers:
  - url: https://api.petstore.test/v1
security:
  - apiKey: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [pets]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, format: int32}
      responses:
        "200":
          description: A page of pets
          headers:
            x-next:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Pet"}
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewPet"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
  /pets/{petId}:
    get:
      operationId: showPetById
      summary: Info for a pet
      tags: [pets]
      parameters:
        - in: path
          name: petId
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
            application/xml:
              schema: {$ref: "#/components/schemas/Pet"}
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [pets]
      parameters:
        - in: path
          name: petId
          required: true
          schema: {type: string, maxLength: 64}
      responses:
        "204":
          description: Deleted
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 100}
        tag: {type: string, maxLength: 50}
    Pet:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
        tag: {type: string}
