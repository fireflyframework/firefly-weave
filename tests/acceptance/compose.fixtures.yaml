# Fixture services for acceptance runs (project weave-acc-<run-id>). Each service joins
# only the installation's egress network, created by weave platform up
# --allow-private-origin; the Acme control port is published on loopback only.
# scripts/acceptance.py and tests/acceptance/conftest.py set every variable.
services:
  acme-api:
    image: ${WEAVE_ACC_ACME_IMAGE:?Run the acceptance prepare stage first}
    pull_policy: never
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ACME_API_KEY_SHA256: ${WEAVE_ACC_ACME_KEY_SHA256:?Set the SHA-256 of the per-run Acme API key}
    ports:
      - "127.0.0.1:${WEAVE_ACC_ACME_CONTROL_PORT:?Choose a loopback control port}:8081"
    networks:
      egress:
        aliases: [acme.acceptance.test]
    labels:
      io.getfirefly.weave.acceptance.run: ${WEAVE_ACC_RUN_ID:?Set the acceptance run ID}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/_control/journal', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  egress:
    external: true
    name: ${WEAVE_ACC_EGRESS_NETWORK:?Name the installation's egress network}
