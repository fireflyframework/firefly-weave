# Authorization matrix for the security journey (J9). [operations] lists every operation added
# after the baseline release, [controls] the operations behind Studio controls a viewer must not
# use. Each row names the capability the operation needs (tests/contracts checks it against the
# operation registry) and one request that is safe to send as any person: "random" becomes a new
# UUID, so a permitted call names nothing that exists; collection names the catalog collection of
# operations whose path has one. The journey expects exactly
# 403 WV-FORBIDDEN where the person's roles lack the capability, and any other answer elsewhere.
baseline = "tests/fixtures/contracts/operations-0.1.0a14.json"

[operations."ai_connections.test"]
capability = "connection.manage"
identifier = "random"
body = { model = "qwen2.5:1.5b", probe_tools = false }

[operations."ai_endpoints.list"]
capability = "catalog.read"

[operations."ai_models.list"]
capability = "catalog.read"
query = { connection = "random" }

[operations."ai_readiness.read"]
capability = "catalog.read"

[operations."ai_setup.grant"]
capability = "connection.manage"
body = { connection_revision_id = "random" }

# Publishes the bundled Ollama connector and its actions in the demo project when permitted.
[operations."ai_setup.publish"]
capability = "definition.publish"
body = {}

[operations."bindable_connections.list"]
capability = "connection.bind"

[operations."language.read"]
capability = "catalog.read"

[operations."run_summaries.list"]
capability = "run.read"

[operations."runs.logs"]
capability = "run.read"
identifier = "random"

[operations."runs.steps"]
capability = "run.read"
identifier = "random"

# A permitted publish fails compilation (no spec), so nothing is published.
[controls."definitions.publish"]
capability = "definition.publish"
collection = "workflows"
body = { source = "apiVersion: weave/v1alpha1\nkind: Workflow\nmetadata: {name: authorization-probe-j9, version: 1.0.0}\n", format = "yaml" }

[controls."runs.start"]
capability = "run.start"
body = { activation_id = "random", input = {} }
