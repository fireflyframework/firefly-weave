# Step enablement for acceptance journeys. A step ("J0.3") or check ("J0.3/owner-roles")
# runs when every requirement holds. A requirement names a product capability, which
# holds once that capability has landed; "ai-models-screen|compose-operations" holds when
# either has. The change that delivers a capability sets its entry to true and adds the
# steps and checks it enables, with their tests.

[capabilities]
"studio-brand" = true
"brand-assets" = true
"docs-brand" = true
"editor-contracts" = false
"editor-canvas" = false
"add-step-panel" = false
"step-details" = false
"formula-editor" = false
"test-data" = false
"step-execution" = false
"decision-table-editor" = false
"editor-runs" = false
"step-tests" = false
"activation-dialog" = false
"text-templates" = false
"loops" = false
"sub-workflows" = false
"editor-hardening" = false
"language-contracts" = false
"text-operators" = true
"instance-keys" = true
"loop-compiler" = true
"loop-runtime" = true
"loop-simulation" = true
"workflow-call-compiler" = true
"workflow-call-runtime" = true
"workflow-call-simulation" = false
"workflow-call-fast-path" = false
"language-docs" = false
"step-error-handling" = false
"ai-gateway" = true
"ai-setup" = false
"ai-models-screen" = true
"ai-task" = false
"weave-ai-ollama" = false
"agents" = false
"agent-editor" = false
"ai-acceptance" = false
"agent-memory" = false
"run-view-contracts" = false
"operations-studio" = false
"run-views" = true
"compose-operations" = false
"kubernetes-operations" = false
"metrics" = false
"logs" = false
"alerts" = false
"operations-explanations" = false
"acceptance-foundations" = true
"real-platform-journeys" = true
"ai-and-cluster-profiles" = false
"quality-gates" = false
"release-verification" = false

[profiles]
pr = ["J0", "J1", "J2", "J3", "J5", "J8", "J9"]
ai = ["J0", "J4", "J7"]
cluster = ["J0", "J6"]
k3d = ["J0", "J6"]
nightly = ["J0", "J1", "J2", "J3", "J4", "J5", "J6", "J7", "J8", "J9", "J10", "J11", "J12", "J13", "J14", "J15"]
release = ["J0", "J1", "J2", "J3", "J4", "J5", "J6", "J7", "J8", "J9", "J10", "J11", "J12", "J13", "J14", "J15"]
docs-shots = ["J0"]

# Success criteria each journey proves.
[criteria]
J0 = ["SC7"]
J1 = ["SC1", "SC7"]
J2 = ["SC2", "SC7"]
J3 = ["SC1", "SC3", "SC7"]
J4 = ["SC1", "SC7"]
J5 = ["SC4", "SC7"]
J6 = ["SC4", "SC7"]
J7 = ["SC5", "SC7"]
J8 = ["SC6", "SC7"]
J9 = ["SC7"]
J10 = ["SC7"]
J11 = ["SC6", "SC7"]
J12 = ["SC7"]
J13 = ["SC7"]
J14 = ["SC1", "SC7"]
J15 = ["SC1", "SC7"]

[steps]
# J0 clean-machine bring-up.
"J0.1" = ["acceptance-foundations"]
"J0.2" = ["acceptance-foundations"]
"J0.2/cluster-tools" = ["kubernetes-operations"]
"J0.3" = ["acceptance-foundations"]
"J0.3/owner-roles" = ["ai-models-screen|compose-operations"]
"J0.3/operations" = ["compose-operations"]
"J0.3/event-fixtures" = ["quality-gates"]
"J0.4" = ["acceptance-foundations"]
"J0.4/step-tester" = ["step-tests", "ai-models-screen"]
"J0.4/deployment-log-reader" = ["logs"]
"J0.4/alert-manager" = ["alerts"]
"J0.5" = ["real-platform-journeys"]
"J0.6" = ["acceptance-foundations"]
"J0.7" = ["acceptance-foundations"]
"J0.7/sftp-password" = ["quality-gates"]
"J0.8" = ["acceptance-foundations"]
"J0.8/catalog" = ["real-platform-journeys"]
"J0.8/child-workflow" = ["real-platform-journeys", "workflow-call-compiler"]
"J0.9" = ["real-platform-journeys", "workflow-call-compiler"]
"J0.10" = ["real-platform-journeys", "compose-operations"]
"J0.11" = ["real-platform-journeys", "step-tests"]
"J0.12" = ["ai-and-cluster-profiles", "ai-gateway"]
"J0.13" = ["ai-and-cluster-profiles", "kubernetes-operations"]
"J0.14" = ["acceptance-foundations"]
# J5 platform administration.
"J5.1" = ["run-views"]
# J1 build the reference workflow in Studio (builder). From J1.3 on, each step waits for
# everything the step before it waits for.
"J1.1" = ["real-platform-journeys", "studio-brand", "brand-assets"]
"J1.2" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details"]
"J1.3" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details"]
# A connection Test sends one request (J1 step 3): weave-http@2.0.0's Test validates the stored connection and
# sends none today, so this check waits for step-details, which brings connections into step details.
"J1.3/test-sends-request" = ["real-platform-journeys", "step-details"]
"J1.4" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details"]
"J1.5" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details"]
"J1.6" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details", "loops", "loop-compiler", "decision-table-editor", "text-templates"]
"J1.7" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details", "loops", "loop-compiler", "decision-table-editor", "text-templates"]
"J1.8" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details", "loops", "loop-compiler", "decision-table-editor", "text-templates", "sub-workflows", "workflow-call-compiler"]
"J1.9" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details", "loops", "loop-compiler", "decision-table-editor", "text-templates", "sub-workflows", "workflow-call-compiler"]
"J1.10" = ["real-platform-journeys", "editor-canvas", "add-step-panel", "step-details", "loops", "loop-compiler", "decision-table-editor", "text-templates", "sub-workflows", "workflow-call-compiler"]
# J2 data at every step (builder). Setup imports and activates the reference workflow, so every
# step waits for its loop and call compilers.
"J2.1" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler"]
"J2.1/execute-offer" = ["step-execution"]
"J2.2" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler", "step-execution", "step-tests"]
"J2.3" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler", "formula-editor", "loops"]
"J2.4" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler", "formula-editor"]
"J2.5" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler", "step-execution", "decision-table-editor"]
"J2.6" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler", "test-data"]
"J2.7" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler", "test-data"]
"J2.8" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler", "step-execution", "step-tests"]
"J2.9" = ["real-platform-journeys", "editor-canvas", "step-details", "loop-compiler", "workflow-call-compiler", "editor-runs", "run-views", "loop-runtime", "workflow-call-runtime"]
# J3 publish, activate, run, follow and resolve (builder, approver).
"J3.1" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
"J3.2" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
"J3.3" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
"J3.4" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
"J3.5" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
"J3.6" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
"J3.7" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
"J3.8" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
"J3.9" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views"]
# Step error handling: On error Continue ends "Succeeded with errors" with no incident; an error
# path runs on an injected fault; a write with an unknown outcome still opens an incident.
"J3.10" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views", "step-error-handling"]
"J3.11" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views", "step-error-handling"]
"J3.12" = ["real-platform-journeys", "loop-compiler", "loop-runtime", "workflow-call-compiler", "workflow-call-runtime", "activation-dialog", "run-views", "step-error-handling"]
# J5 platform administration (operator); J5.1 belongs to the operations reads above.
"J5.2" = ["real-platform-journeys", "run-views", "compose-operations"]
"J5.3" = ["real-platform-journeys", "run-views", "compose-operations"]
"J5.4" = ["real-platform-journeys", "run-views", "compose-operations", "metrics"]
"J5.5" = ["real-platform-journeys", "run-views", "compose-operations", "logs"]
"J5.6" = ["real-platform-journeys", "run-views", "compose-operations", "metrics", "alerts"]
"J5.7" = ["real-platform-journeys", "run-views", "compose-operations"]
# J8 brand and naming: Studio, CLI, docs site, desktop icons, repository.
"J8.1" = ["real-platform-journeys", "studio-brand", "brand-assets"]
"J8.2" = ["real-platform-journeys", "brand-assets"]
"J8.3" = ["real-platform-journeys", "docs-brand"]
"J8.4" = ["release-verification"]
"J8.5" = ["real-platform-journeys", "studio-brand", "brand-assets"]
# J9 security and negative paths. J9.4 is recorded by the scan stage.
"J9.1" = ["real-platform-journeys"]
"J9.2" = ["real-platform-journeys"]
"J9.2/execute-in-local" = ["step-execution", "step-tests"]
"J9.2/operations-controls" = ["compose-operations"]
"J9.3" = ["real-platform-journeys"]
"J9.3/model-origins" = ["ai-and-cluster-profiles"]
"J9.4" = ["real-platform-journeys"]
"J9.4/storage-keys" = ["editor-contracts"]

[step_profiles]
"J0.2/cluster-tools" = ["cluster", "k3d", "nightly", "release"]
"J0.3/event-fixtures" = ["nightly", "release"]
"J0.7/sftp-password" = ["nightly", "release"]
"J0.12" = ["ai", "nightly", "release"]
"J0.13" = ["cluster", "k3d", "nightly", "release"]
"J5.1" = ["pr", "nightly", "release"]
"J8.4" = ["nightly", "release"]
