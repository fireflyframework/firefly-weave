# Step enablement for acceptance journeys (acceptance spec §2.1 rule 7 and §10.2).
# A step ("J0.3") or check ("J0.3/owner-roles") runs when every requirement holds;
# "A3|O3" holds when either milestone merged. Each milestone PR sets its own entry to
# true and adds the steps and checks it enables, with their tests.

[milestones]
"brand-PR1" = false
"brand-PR2" = false
"brand-PR3" = false
"E-M0" = false
