# Tools and images acceptance runs pin. The prepare stage pulls every image here by
# digest; tests/unit/test_acceptance_journeys.py keeps these equal to the files that use
# them. The cluster tools (kind, k3d, kubectl) arrive with the AI and cluster profiles, and
# GreenMail, SFTP and Kafka with the quality gates.
version = 1

[tools]
compose_min = "2.30"
node = "24.15.0"
uv = "0.8.22"
playwright = "1.55.1"

[images]
postgres = "postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73"
keycloak = "quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c"
python = "python:3.12-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e"
uv = "ghcr.io/astral-sh/uv:0.8.22@sha256:9874eb7afe5ca16c363fe80b294fe700e460df29a55532bbfea234a0f12eddb1"
