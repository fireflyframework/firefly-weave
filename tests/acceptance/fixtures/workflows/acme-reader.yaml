# J9.3 runs this workflow through one connection per destination: the approved Acme
# connection, then connections to private origins the policy must refuse before any
# request leaves. The "acme" slot is bound to a connection revision at activation.
apiVersion: weave/v1alpha1
kind: Workflow
metadata:
  name: acme-reader
  version: 1.0.0
spec:
  connections:
    acme: {connector: weave-http@2.0.0}
  inputSchema: {type: object, additionalProperties: false}
  outputSchema: {}
  steps:
    - id: read
      kind: action
      uses: acme-get-customer@1.0.0
      connection: acme
      with:
        object:
          path:
            object:
              id: {literal: C-1001}
  output: {ref: /steps/read/output/body}
