# Risk tier of one Acme order, first hit: a country outside ES, PT, FR and DE is rejected,
# an amount above 1000 needs review, everything else is automatic (O-1 auto, O-2 review, O-3 reject).
apiVersion: weave/v1alpha1
kind: DecisionTable
metadata: {name: risk-tier, version: 1.0.0}
spec:
  inputSchema:
    type: object
    properties:
      id: {type: string}
      amount: {type: number}
      country: {type: string}
    required: [amount, country]
  outputSchema:
    type: object
    properties:
      tier: {type: string, enum: [reject, review, auto]}
    required: [tier]
    additionalProperties: false
  hitPolicy: first
  rules:
    - id: country-not-served
      when: {op: {name: notIn, args: [{ref: /input/country}, {literal: [ES, PT, FR, DE]}]}}
      output: {literal: {tier: reject}}
    - id: large-amount
      when: {op: {name: gt, args: [{ref: /input/amount}, {literal: 1000}]}}
      output: {literal: {tier: review}}
    - id: everything-else
      when: {literal: true}
      output: {literal: {tier: auto}}
