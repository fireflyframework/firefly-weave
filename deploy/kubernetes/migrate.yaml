apiVersion: batch/v1
kind: Job
metadata:
  name: __WEAVE_MIGRATION_JOB__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weave-migrate
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __WEAVE_SERVER_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [python, -I, -m, firefly_weave.cli.main, admin, migrate]
          env:
            - name: WEAVE_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weave-migration
                  key: WEAVE_MIGRATION_DATABASE_URL
            - name: WEAVE_OPERATIONS_POLICY
              valueFrom:
                secretKeyRef:
                  name: weave-migration
                  key: WEAVE_OPERATIONS_POLICY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
