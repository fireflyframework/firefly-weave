apiVersion: apps/v1
kind: Deployment
metadata:
  name: weave-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: weave-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weave-api
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __WEAVE_SERVER_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: WEAVE_SCHEDULER_ENABLED
              value: "true"
            - name: WEAVE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weave-api-runtime
                  key: WEAVE_DATABASE_URL
            - name: WEAVE_SCHEDULER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weave-api-runtime
                  key: WEAVE_SCHEDULER_DATABASE_URL
            - name: WEAVE_OIDC_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: weave-api-runtime
                  key: WEAVE_OIDC_PROVIDERS
            - name: WEAVE_OPERATIONS_POLICY
              valueFrom:
                secretKeyRef:
                  name: weave-api-runtime
                  key: WEAVE_OPERATIONS_POLICY
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weave-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: weave-api
  ports:
    - name: http
      port: 8000
      targetPort: http
