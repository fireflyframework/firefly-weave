services:
  keycloak-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: weave_keycloak
      POSTGRES_USER: weave_keycloak
      POSTGRES_PASSWORD: ${WEAVE_KC_DB_PASSWORD:?Generate .env.identity first}
    volumes:
      - weave-keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave_keycloak -d weave_keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: ["start-dev", "--import-realm"]
    mem_limit: 1g
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEAVE_KEYCLOAK_PORT:-18080}:8080"
      - "127.0.0.1:${WEAVE_CONTAINER_API_PORT:-8081}:8000"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/weave_keycloak
      KC_DB_USERNAME: weave_keycloak
      KC_DB_PASSWORD: ${WEAVE_KC_DB_PASSWORD:?Generate .env.identity first}
      KC_HOSTNAME: http://localhost:${WEAVE_KEYCLOAK_PORT:-18080}
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: weave-bootstrap
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: ${WEAVE_KC_ADMIN_SECRET:?Generate .env.identity first}
      WEAVE_HOST_SECRET: ${WEAVE_HOST_SECRET:?Generate .env.identity first}
      WEAVE_WORKER_SECRET: ${WEAVE_WORKER_SECRET:?Generate .env.identity first}
      WEAVE_DENIED_SECRET: ${WEAVE_DENIED_SECRET:?Generate .env.identity first}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
volumes:
  weave-keycloak-db:
    name: ${WEAVE_KEYCLOAK_VOLUME:-firefly-weave-keycloak-db}
