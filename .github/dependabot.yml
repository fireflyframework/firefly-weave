# Workflows pin every action to a full commit SHA with its version in a trailing comment.
# Dependabot moves the SHA and the comment together, so the pins keep getting fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new action release waits two weeks before it is proposed; security updates do not wait.
    cooldown:
      default-days: 14
    groups:
      # Minor and patch releases of every action arrive in one pull request; a major release gets its own.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
    # The pin follows the 1.96.0 branch and the toolchain is bumped by hand; its only tag, v1, needs a toolchain input and would break the build.
    ignore: [{dependency-name: dtolnay/rust-toolchain}]
