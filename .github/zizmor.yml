# Workflow audit findings accepted after review, each with its reason. Every entry names the exact line it accepts,
# so a change that moves or adds a finding is reported again.
rules:
  self-hosted-runner:
    ignore:
      # ci.yml, job `release`: the release gate on the owned self-hosted runner, started only by a manual run with
      # `release` set. No runner is registered for it today; the release gate runs locally. Before a runner is
      # registered, the weave-owned-release environment gets required reviewers and a deployment policy that allows
      # only v* tags, and the runner is ephemeral and in a runner group restricted to this repository.
      - ci.yml:195
