name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# The token can do nothing unless a job asks for more: the build reads the repository, and only the deploy job
# writes, to GitHub Pages.
permissions: {}
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
# Each job's timeout is about 1.5 times its slowest recent green run, and at least 10 minutes: a build takes
# under a minute, so a hung step fails within minutes instead of after GitHub's 6-hour default.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.22'
          python-version: '3.12'
      # Build only public documentation; the hook explicitly selects assets and
      # project pages. The repository itself is never uploaded as a Pages artifact.
      - name: Build the documentation
        run: uv run --locked --group docs --extra openapi mkdocs build --strict
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
