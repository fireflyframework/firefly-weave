# The required real-backend gates on the owned self-hosted release runner. Only a maintainer's manual run starts
# this workflow: no pull request, push or tag does, so a pull request's code never reaches that runner through it.
name: Release gate
on:
  workflow_dispatch:
permissions: {}
# One release gate at a time per ref; a second manual run waits instead of cancelling the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: release gate
    runs-on: [self-hosted, weave-owned-release]
    # The 0.1.0a19 release gate ran its stages in about 105 minutes on a local machine.
    timeout-minutes: 180
    environment: weave-owned-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: uv run --locked --no-editable --reinstall-package firefly-weave --all-extras --group docs python scripts/check.py --release --docker-context colima-weave-tests
# The release runner supplies guarded PostgreSQL/Keycloak/Kafka, the retained
# predecessor artifact/interpreter, and secret environment variables. This job builds
# the current exact-wheel images and clean installed closures. Missing inputs
# fail the prerequisite stage; the offline job is never a substitute for release gates.
# Private stage logs and databases remain on the owned runner, not uploaded to artifacts.
