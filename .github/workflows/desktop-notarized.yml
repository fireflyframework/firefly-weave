name: Notarized macOS installers

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Sign and submit this exact release tag to Apple (requires protected environment approval)'
        type: boolean
        required: true
        default: false

# The token can do nothing unless a job asks for more: the signing job only reads the repository.
permissions: {}

jobs:
  macos:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.notarize == true &&
      github.repository == 'fireflyframework/firefly-weave' && startsWith(github.ref, 'refs/tags/v')
    environment: macos-release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # The same cargo network settings as the unsigned installers in desktop.yml, which say why.
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '10'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The installers this job signs come from a clean install of the lockfiles, never from a cache
      # another run wrote.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.19'
          python-version: '3.12.13'
          enable-cache: false
      - name: Verify exact release source without credentials
        run: uv run --no-project python desktop/scripts/notarize_macos.py --verify-source
      # No npm cache either: setup-node turns one on by itself when package.json names npm as its packageManager.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.96.0'
          components: rustfmt,clippy
          targets: ${{ matrix.target }}
      # The same step as in desktop.yml, which says why: crates first, fetched again only after a network failure.
      - name: Fetch locked crates
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked --target "$TARGET" --manifest-path desktop/src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/cargo-fetch.log"; then
              exit 0
            fi
            grep -qE "curl failed|failed to get successful HTTP response" "$RUNNER_TEMP/cargo-fetch.log" || exit 1
            [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::Fetching crates failed on attempt $attempt of 3 with a network error; fetching again"
            sleep $((attempt * 10))
          done
      - name: Prepare locked tools
        run: |
          uv sync --locked --extra studio
          uv pip install pyinstaller==6.16.0
          npm ci --prefix studio
          npm ci --prefix desktop
      - name: Verify source and compile Studio before loading credentials
        run: |
          uv run --no-sync python -m pytest tests/unit/test_macos_seal.py tests/unit/test_macos_notarization.py -q
          npm run check --prefix studio
          npm test --prefix studio
          npm run build --prefix studio
          cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Sign, notarize, verify and collect exact installers
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: uv run --no-sync python desktop/scripts/notarize_macos.py --target ${{ matrix.target }}
      - name: Remove temporary signing credentials even after interruption
        if: always()
        run: uv run --no-project python desktop/scripts/notarize_macos.py --cleanup
      - name: Retain verified notarized installers only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weave-studio-${{ github.ref_name }}-${{ matrix.target }}-notarized
          if-no-files-found: error
          path: desktop/work/notarized-assets/**
# This opt-in workflow retains artifacts; it never creates or modifies a release.
