name: Checks
on:
  # Branch pushes are covered by their pull request run; main and release tags
  # still get their own run (release evidence links the main and tag Checks).
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
# The token can do nothing unless a job asks for more: every job here only reads the repository.
permissions: {}
# A new commit on a pull request cancels that pull request's older run. Every
# other run (main, tags, manual dispatch) gets its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Tag runs restore no dependency cache: what a tag checks or builds installs from the lockfiles alone,
# never from a cache another run wrote. Every other run keeps its uv and npm caches. setup-node's
# package-manager-cache stays off, so a packageManager field cannot turn an npm cache on for a tag run.
# Each job's timeout is about 1.5 times its slowest recent green run, rounded up to 5 minutes, and at least 10
# for a job that installs dependencies: a hung step fails the run long before GitHub's 6-hour default, and a slow
# runner is not cut off.
jobs:
  offline:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Slowest recent green run: 50 minutes, most of it the unit and contract tests, whose own stage may take up to
    # 90; the job leaves room for the stages around it.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'auto' }} # zizmor: ignore[cache-poisoning] -- uv cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
      - run: uv run --locked --no-editable --reinstall-package firefly-weave --all-extras --group docs python scripts/check.py
  # The PostgreSQL integration tests, as the release gate's integration stage runs them, on every pull request and
  # every push to main: one PostgreSQL 17 service, the image compose.yaml pins, with its data on tmpfs.
  integration:
    name: integration (PostgreSQL 17)
    # Manual runs only for now: on a four-core hosted runner shared by four test workers and PostgreSQL, three of its
    # first four runs each failed a different test that depends on timing. It runs on pull requests and main again
    # once the suite is split across runners and those tests are fixed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # No green run to size it from yet: four local workers took about 25 minutes, and the unit tests run up to 2.5
    # times slower on a shared runner than locally.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: weave_b1_owner
          # Not a secret: a throwaway server on this job's runner, with no data, gone when the job ends.
          POSTGRES_PASSWORD: weave-ci-integration
          POSTGRES_DB: weave_b1_control
        # 55433 is the release gate's PostgreSQL port; the PostgreSQL connector tests accept no other.
        ports:
          - '55433:5432'
        options: >-
          --shm-size 256mb
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U weave_b1_owner -d weave_b1_control"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      WEAVE_TEST_DATABASE_URL: postgresql+asyncpg://weave_b1_owner:weave-ci-integration@127.0.0.1:55433/weave_b1_control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'auto' }} # zizmor: ignore[cache-poisoning] -- uv cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
      - run: uv sync --locked --all-extras --group docs
      # The fixtures refuse a server without the marker infra/postgres/init.sql writes; compose.yaml runs that file
      # when its server first starts, and a service container cannot mount it, so this step runs it.
      - name: Mark the service as the integration backend
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -q -U weave_b1_owner -d weave_b1_control < infra/postgres/init.sql
      # The test-only connector package, installed without dependencies as the release gate installs it.
      - run: uv pip install --no-deps ./tests/fixtures/e2-provider
      # Deselected: the 36 tests that need a service this job does not start. The release gate, which has all of
      # those services, still runs every one of them.
      # - A Kafka broker from the owned Kafka image in the owned Docker context: test_kafka.py, test_kafka_api.py,
      #   test_kafka_native.py, and the broker half of test_kafka_tls.py.
      # - Keycloak: test_keycloak.py, and test_cli_identity.py, whose CLI sign-ins all go through it.
      # - A Weave image built from this commit: test_native_image.py and the image case of test_postgresql_native.py.
      # - The owned Docker context, for the PostgreSQL TLS server: test_postgresql_tls.py.
      # Also deselected until it is fixed, though the release gate still runs it:
      # test_transaction_runtime.py::test_a_held_run_never_stops_the_timeouts_of_runs_after_it. Its outcome depends
      # on its held run's random ID: when that ID sorts in about the top fifth, the test starts so many runs that its
      # three scan rounds never reach the held run, or the project's control allocation refuses a start, so it fails
      # about one run in five.
      # test_step_test_limits.py::test_two_starts_at_once_count_each_other, until it is fixed as well: on a busy runner
      # the second of two simultaneous starts can be refused as WV-OPERATION-CAPACITY (its transaction's 250 ms lock
      # timeout) before it is counted and refused as WV-STEPTEST-BUSY, which the test expects.
      # Two more of the same kind, from test_parallel.py: test_two_replicas_join_once, whose two simultaneous
      # completions can meet the same 250 ms lock timeout, and the mixed_signal_overall case of
      # test_timely_signal_survives_sibling_suspension_until_recovery_or_overall_timeout, which sleeps 1.1 s and
      # expects the overall timeout not to have fired yet. And test_operations_cache_refresh.py::
      # test_policy_change_withholds_until_cache_is_revalidated, which failed the same way on a busy runner.
      # test_restore_manifest.py runs in the next step, alone: it compares every weave_ role on the server between
      # two moments, and the other workers create and drop their own login roles all the time.
      - name: Integration tests
        run: >-
          uv run --locked --all-extras --group docs python -m pytest tests/integration -n 4 --dist loadfile
          -q --tb=short --show-capture=no -rfEs --durations=10 -p no:cacheprovider
          --deselect tests/integration/connectors/test_kafka.py
          --deselect tests/integration/connectors/test_kafka_api.py
          --deselect tests/integration/connectors/test_kafka_native.py
          --deselect tests/integration/connectors/test_kafka_tls.py::test_real_sasl_tls_ack_wrong_ca_identity_and_max_value
          --deselect tests/integration/test_keycloak.py
          --deselect tests/integration/test_cli_identity.py
          --deselect tests/integration/test_native_image.py
          --deselect 'tests/integration/connectors/test_postgresql_native.py::test_built_native_sql_executor[image]'
          --deselect tests/integration/connectors/test_postgresql_tls.py
          --deselect tests/integration/test_transaction_runtime.py::test_a_held_run_never_stops_the_timeouts_of_runs_after_it
          --deselect tests/integration/test_step_test_limits.py::test_two_starts_at_once_count_each_other
          --deselect tests/integration/test_parallel.py::test_two_replicas_join_once
          --deselect tests/integration/test_operations_cache_refresh.py::test_policy_change_withholds_until_cache_is_revalidated
          --deselect 'tests/integration/test_parallel.py::test_timely_signal_survives_sibling_suspension_until_recovery_or_overall_timeout[mixed_signal_overall]'
          --deselect tests/integration/test_restore_manifest.py
      - name: Restore manifest tests, with no other test changing the server's roles
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked --all-extras --group docs python -m pytest tests/integration/test_restore_manifest.py
          -q --tb=short --show-capture=no -rfEs -p no:cacheprovider
  studio-checks:
    name: studio checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'auto' }} # zizmor: ignore[cache-poisoning] -- uv cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
      - run: uv sync --locked --all-extras --group docs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }} # zizmor: ignore[cache-poisoning] -- npm cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
          package-manager-cache: false
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run check && npm run format:check && npm test && npm run build
        working-directory: studio
  studio-browser:
    name: studio browser (${{ matrix.shard }}/5)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'auto' }} # zizmor: ignore[cache-poisoning] -- uv cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
      - run: uv sync --locked --all-extras --group docs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }} # zizmor: ignore[cache-poisoning] -- npm cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
          package-manager-cache: false
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      # The real-host test serves the production bundle from studio/dist.
      - run: npm run build
        working-directory: studio
      - run: npx playwright install --with-deps chromium
        working-directory: studio
      - name: Functional browser tests
        run: npm run test:browser -- --grep-invert @performance --shard=${{ matrix.shard }}/5
        working-directory: studio
  # Frame timing needs an idle runner: another browser can otherwise consume the
  # frame budget while running unrelated functional checks.
  studio-performance:
    name: studio performance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The Playwright install fetches its OS packages from the runner's Ubuntu mirror: up to 611 s in a studio job, while
    # the other steps take up to 143 s. At 10 minutes, two runs whose steps had all passed were cancelled.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'auto' }} # zizmor: ignore[cache-poisoning] -- uv cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
      - run: uv sync --locked --all-extras --group docs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }} # zizmor: ignore[cache-poisoning] -- npm cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
          package-manager-cache: false
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npx playwright install --with-deps chromium
        working-directory: studio
      - name: Canvas performance measurements
        run: npm run test:browser -- --grep @performance --workers=1 --retries=0 --output=test-results/performance
        working-directory: studio
  # The single check named "studio" passes only when every Studio job passed.
  studio:
    if: always()
    needs: [studio-checks, studio-browser, studio-performance]
    runs-on: ubuntu-24.04
    # It reads no repository content, so its token gets no permission at all.
    permissions: {}
    # It only reads the results of the jobs it needs.
    timeout-minutes: 5
    steps:
      - name: Every Studio job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Studio job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
  xplat:
    name: cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.22'
          python-version: '3.12'
          enable-cache: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'auto' }} # zizmor: ignore[cache-poisoning] -- uv cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
      - run: uv sync --locked --all-extras --group docs
      - name: Portable Python unit subset
        run: uv run --no-sync python -m pytest tests/unit/compiler tests/contracts tests/unit/email tests/unit/providers tests/unit/operations tests/unit/test_private_origins.py tests/unit/test_release_versions.py tests/unit/test_acme_fixture.py tests/unit/test_acceptance_journeys.py tests/unit/test_acceptance_evidence.py tests/unit/test_ci_workflows.py -q --tb=short --show-capture=no -p no:cacheprovider
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }} # zizmor: ignore[cache-poisoning] -- npm cache is off on tag runs; PR, main and manual runs only read caches their own ref or main wrote
          package-manager-cache: false
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - name: Studio unit tests and production build
        run: npm test && npm run build
        working-directory: studio
      - run: npx playwright install chromium
        working-directory: studio
      - name: Cross-platform Playwright subset
        run: npx playwright test --grep @xplat
        working-directory: studio
# The release gate on the owned self-hosted runner is in release-gate.yml, which only a manual run starts.
