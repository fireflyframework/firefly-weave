      - Author a connector: connectors/authoring.md
      - Import OpenAPI metadata: connectors/metadata-import.md
      - HTTP profiles: connectors/http-profiles.md
      - PostgreSQL: connectors/postgresql.md
      - Kafka: connectors/kafka.md
      - Microsoft Teams: connectors/teams.md
      - WhatsApp: connectors/whatsapp.md
      - Telegram: connectors/telegram.md
  - Operate and deploy:
      - Remote deployment explained: operations/remote-deployment.md
      - Deployment: operations/deployment.md
      - Cloud deployment: operations/cloud-deployment.md
      - AWS: operations/aws.md
      - Azure: operations/azure.md
      - Google Cloud: operations/gcp.md
      - Kubernetes: operations/kubernetes.md
      - Configuration: operations/configuration.md
      - Choose your identity provider and grants: operations/identity-and-secrets.md
