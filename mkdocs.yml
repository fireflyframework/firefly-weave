      - Worker protocol: reference/worker-protocol.md
      - HTTP and webhooks: reference/http-and-webhooks.md
      - Provider sources: reference/provider-sources.md
      - Integration events: reference/integration-events.md
      - Schedules and timers: reference/schedules-and-timers.md
      - History and replay: reference/history-and-replay.md
