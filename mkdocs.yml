site_name: Firefly Weave
site_description: Learn, integrate, and operate the Firefly Weave workflow platform.
site_author: Firefly Software Foundation
site_url: https://fireflyframework.github.io/firefly-weave/
repo_url: https://github.com/fireflyframework/firefly-weave
repo_name: fireflyframework/firefly-weave
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Firefly Software Foundation · Apache-2.0
strict: true
docs_dir: docs
site_dir: build/docs-site
exclude_docs: |
  implementation-status.md
  superpowers/
  .superpowers/
hooks:
  - scripts/docs_hook.py
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
theme:
  name: material
  language: en
  font: false
  logo: assets/weave-logo-reversed.svg
  favicon: assets/weave-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark appearance
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light appearance
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
extra_css:
  - stylesheets/weave.css
nav:
  - Start here:
      - Documentation: README.md
      - Start here: guides/learning-path.md
      - People, workers, and workflow lifecycle: guides/roles-and-lifecycle.md
      - How the platform works: guides/platform-overview.md
      - Start a local platform: guides/local-platform.md
      - Installation: installation.md
      - First workflow: quickstart.md
      - Concepts: concepts.md
      - Visual guide: visual-guide.md
      - Capabilities and limits: capabilities.md
  - Workflows and runs:
      - Connect to an API: guides/connect-to-api.md
      - Run a local platform: guides/standalone.md
      - Publish and run with the CLI: guides/cli-tutorial.md
      - Author workflows: guides/workflow-authoring.md
      - View workflow graphs: guides/workflow-graphs.md
      - Build workers: guides/workers.md
  - API and SDKs:
      - Try requests with Swagger: guides/api-playground.md
      - Python SDK step by step: guides/sdk-tutorial.md
      - Integrate your product: guides/host-integration.md
      - Every HTTP operation and schema: reference/api-explorer.md
      - HTTP behavior and errors: reference/api.md
      - Python SDK reference: reference/sdk.md
      - Embed the compiler or services: reference/embedding.md
  - Integrations:
