<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Install Firefly Weave Studio</title>
<desc id="desc">Drag the app on the left into Applications on the right, then open Studio from Applications.</desc>
<rect width="720" height="440" fill="#F6F4EC"/>
<path d="M0 0H720V6H0Z" fill="#173D34"/>
<g transform="translate(44 42) scale(.20)">
<title id="weave-symbol-title">Firefly Weave symbol</title>
<desc id="weave-symbol-desc">Two interlaced V-shaped bands form a compact W. A clear diagonal underpass preserves the woven structure in color and in one color. Forest and jade on a transparent background; use on white or light neutral surfaces.</desc>
<defs>
<mask id="weave-underpass" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<rect width="256" height="256" fill="#fff"/>
<path d="M112 178 L144 106" fill="none" stroke="#000" stroke-width="40"/>
</mask>
</defs>
<g fill="none" stroke-width="28" stroke-linejoin="miter" stroke-miterlimit="4">
<path d="M88 52 L152 196 L216 52" stroke="#367D68" mask="url(#weave-underpass)"/>
<path d="M40 52 L104 196 L168 52" stroke="#173D34"/>
</g>
</g>
<text x="110" y="77" fill="#173D34" font-family="Georgia, serif" font-size="29">Firefly Weave Studio</text>
<text x="50" y="125" fill="#486459" font-family="Arial, sans-serif" font-size="17">Drag the app into Applications to install.</text>
<circle cx="190" cy="236" r="76" fill="#EEECE1"/>
<circle cx="530" cy="236" r="76" fill="#EEECE1"/>
<path d="M304 236H416M401 223L416 236L401 249" fill="none" stroke="#AD8233" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M50 354H670" stroke="#DBDDD0"/>
<text x="50" y="389" fill="#173D34" font-family="Arial, sans-serif" font-size="15">Then open Firefly Weave Studio from Applications.</text>
<text x="50" y="416" fill="#65766B" font-family="Arial, sans-serif" font-size="12">Firefly Software Foundation</text>
</svg>
