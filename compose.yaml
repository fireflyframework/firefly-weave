name: firefly-weave-dev
services:
  postgres:
    shm_size: 256mb
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: weave_b1_owner
      POSTGRES_PASSWORD: ${WEAVE_POSTGRES_PASSWORD:?Run scripts/setup-local.py first}
      POSTGRES_DB: weave_b1_control
    ports:
      - "127.0.0.1:${WEAVE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - weave-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-weave.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave_b1_owner -d weave_b1_control"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  weave-postgres:
    name: ${WEAVE_POSTGRES_VOLUME:-firefly-weave-dev-postgres}
