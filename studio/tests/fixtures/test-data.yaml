apiVersion: weave/v1alpha1
kind: Workflow
metadata: {name: tiered-orders, version: 1.0.0}
spec:
  inputSchema:
    type: object
    required: [customerId, amount]
    properties:
      customerId: {type: string, title: Customer ID}
      amount: {type: number, title: Amount}
      password: {type: string, title: Password, x-secret: true}
  outputSchema: {type: object}
  llmProfiles:
    default: {provider: ollama, model: "qwen3:4b"}
  steps:
    - id: lookup
      kind: action
      uses: crm.lookup@1.0.0
      with: {object: {customerId: {ref: /input/customerId}}}
    - id: score
      kind: transform
      value: {object: {tier: {ref: /steps/lookup/output/tier}}}
    - id: summarize
      kind: llm
      uses: weave-agentic-generate@1.0.0
      profile: default
      prompt: {literal: Summarize the order}
      context: {literal: {}}
    - id: notify
      kind: action
      uses: crm.lookup@1.0.0
      with: {object: {customerId: {ref: /steps/score/output/tier}}}
  output: {literal: {}}
