<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">Firefly Weave monochrome symbol</title>
<desc id="desc">The woven W in one forest color, with a transparent diagonal underpass. For single-color use on white or light neutral surfaces.</desc>
<defs>
<mask id="weave-underpass" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<rect width="256" height="256" fill="#fff"/>
<path d="M112 178 L144 106" fill="none" stroke="#000" stroke-width="40"/>
</mask>
</defs>
<g fill="none" stroke-width="28" stroke-linejoin="miter" stroke-miterlimit="4">
<path d="M88 52 L152 196 L216 52" stroke="#173D34" mask="url(#weave-underpass)"/>
<path d="M40 52 L104 196 L168 52" stroke="#173D34"/>
</g>
</svg>
