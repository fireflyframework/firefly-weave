services:
  kafka:
    profiles: [kafka]
    image: ${WEAVE_KAFKA_IMAGE:?Set an immutable Kafka image digest}
    ports:
      - "127.0.0.1:${WEAVE_KAFKA_PORT:?Set the isolated Kafka port}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${WEAVE_KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_MESSAGE_MAX_BYTES: 1052672
      KAFKA_REPLICA_FETCH_MAX_BYTES: 1052672
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    labels:
      org.firefly-weave.owner: d2-owned-acceptance
