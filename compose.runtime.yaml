services:
  api:
    pull_policy: never
    image: ${WEAVE_SERVER_IMAGE:?Set an exact prepared local server image ID}
    read_only: true
    user: "65532:65532"
    tmpfs: [/tmp]
    stop_grace_period: 30s
    env_file:
      - path: ${WEAVE_API_ENV_FILE:-.env.api-container}
        format: raw
    ports:
      - "127.0.0.1:${WEAVE_API_PORT:-8080}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # This replica owns recovery; its env file must include the separate scheduler URL.
    environment:
      WEAVE_SCHEDULER_ENABLED: "true"
  native-executor:
    pull_policy: never
    image: ${WEAVE_SERVER_IMAGE:?Set an exact prepared local server image ID}
    read_only: true
    user: "65532:65532"
    tmpfs: [/tmp]
    stop_grace_period: 30s
    env_file:
      - path: ${WEAVE_NATIVE_ENV_FILE:-.env.native-container}
        format: raw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEAVE_SCHEDULER_ENABLED: "false"
  worker:
    pull_policy: never
    image: ${WEAVE_WORKER_IMAGE:?Set an exact prepared local worker image ID}
    read_only: true
    user: "65532:65532"
    tmpfs: [/tmp]
    stop_grace_period: 30s
    env_file:
      - path: ${WEAVE_WORKER_ENV_FILE:-.env.worker-container}
        format: raw
    extra_hosts:
      - "host.docker.internal:host-gateway"
