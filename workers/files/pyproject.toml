[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "weave-files-worker"
version = "0.1.7"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Lease-bound FTP, SFTP and cloud-drive transfers for Firefly Weave"
requires-python = ">=3.12,<3.15"
dependencies = ["firefly-weave[worker]==0.1.0a15", "httpx>=0.28.1,<1", "aioftp==0.28.0", "asyncssh==2.24.0"]

[project.scripts]
weave-files-worker = "weave_files_worker.main:run"

[tool.uv.sources]
firefly-weave = { path = "../.." }

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1", "mypy>=1.20,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/LICENSE", "/NOTICE", "/Dockerfile", "/Dockerfile.dockerignore"]
