[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "weave-agentic-worker"
version = "0.1.2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Lease-bound Firefly Agentic model worker for Firefly Weave"
requires-python = ">=3.13,<3.15"
dependencies = [
  "firefly-weave==0.1.0a10",
  "pyfly[oauth2-client] @ https://github.com/fireflyframework/fireflyframework-pyfly/releases/download/v26.09.15/pyfly-26.9.15-py3-none-any.whl#sha256=c712b314cbaaaaec9aa7ec7f256fb8a31e6faf228e3bd52715356fd689c8943b",
  "fireflyframework-agentic @ https://github.com/fireflyframework/fireflyframework-agentic/releases/download/v26.09.0/fireflyframework_agentic-26.9.0-py3-none-any.whl#sha256=a6ecb82abd54c9a1d4fa71af46593b57228ed3336e41ea0f0e821724d9bf0224",
  "httpx>=0.28.1,<1",
  "httpx2>=2.0,<3",
  "uvicorn>=0.41,<1",
]

[project.scripts]
weave-agentic-worker = "weave_agentic_worker.main:run"
weave-lumi-gateway = "weave_agentic_worker.gateway:run"

[tool.uv.sources]
firefly-weave = { path = "../.." }

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1", "mypy>=1.20,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/LICENSE", "/NOTICE", "/Dockerfile", "/Dockerfile.dockerignore"]
