pyfly:
  app:
    name: firefly-weave
  banner:
    mode: 'OFF'
  logging:
    level:
      root: WARNING
      weave.authorization: INFO
  cloud:
    config:
      enabled: false
  data:
    enabled: false
    relational:
      enabled: false
      ddl-auto: none
      migration:
        enabled: false
  admin:
    enabled: false
  management:
    enabled: false
    server:
      port: -1
  web:
    request-logging:
      enabled: false
    welcome:
      enabled: false
    docs:
      enabled: false
    actuator:
      enabled: false
  security:
    enabled: false
    oauth2:
      resource-server:
        enabled: false
  idp:
    enabled: false
  observability:
    metrics:
      enabled: false
    tracing:
      enabled: false
      exclude-patterns: ['*']
  server:
    observability:
      enabled: false
